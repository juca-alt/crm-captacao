<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Embaixadores da Proteção</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- EMBAIXADORES-V5 · T5 (16/10/2026) — o PORTAL do embaixador (mobile-first). PROMPT_CODE "Embaixadores da Proteção".
     Ele entra por link mágico no e-mail (sem senha) e vê SÓ os leads dele que o Gustavo escolheu, com nome, etapa e valor.
     O isolamento é do BANCO (view emb_portal + RPC emb_esquentei; ver supabase/migrations/embaixadores_v4_portal.sql):
     esta página não recebe telefone, renda, GI nem nada de outro embaixador — não há o que esconder aqui.
     3 blocos: Para esquentar (botão "Esquentei" — o único movimento dele), Em andamento, Fechados (valor a receber).
     Rodapé: total a receber. Valor sem comissão registrada = "—", nunca R$ 0,00 inventado (T6). -->
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#15212b;--mut:#5b6873;--linha:#e3e8ee;--azul:#2563eb;--verde:#16a34a;--laranja:#ea580c;--sombra:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#17212b;--tx:#e6edf3;--mut:#93a1ad;--linha:#26323e;--azul:#3b82f6;--verde:#22c55e;--laranja:#f97316;--sombra:none}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#17212b;--tx:#e6edf3;--mut:#93a1ad;--linha:#26323e;--azul:#3b82f6;--verde:#22c55e;--laranja:#f97316;--sombra:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header h1{font-size:19px;margin:0;flex:1;line-height:1.2}
header small{display:block;font-size:13px;color:var(--mut);font-weight:400}
.btn{font:inherit;border-radius:12px;border:1px solid var(--linha);background:var(--card);color:var(--tx);padding:10px 16px;min-height:44px;cursor:pointer;font-weight:600}
.btn-p{background:var(--azul);border-color:var(--azul);color:#fff}
.btn-ok{background:var(--laranja);border-color:var(--laranja);color:#fff;white-space:nowrap}
.btn-ok.conf{background:var(--verde);border-color:var(--verde)}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:16px;box-shadow:var(--sombra)}
.mut{color:var(--mut);font-size:13px}
.login input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--linha);border-radius:12px;background:var(--bg);color:var(--tx);min-height:48px;margin:10px 0}
.login .btn{width:100%}
.bloco{margin-top:16px}
.bloco h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.bloco h2 .n{background:var(--linha);border-radius:999px;padding:1px 9px;font-size:12.5px}
.lista{background:var(--card);border:1px solid var(--linha);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--linha);min-height:56px}
.item:first-child{border-top:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--linha);color:var(--mut);white-space:nowrap}
.vazio{padding:14px;color:var(--mut);font-size:13.5px}
details.enc{margin-top:16px}
details.enc>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--mut)}
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--linha);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.rodape>div{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rodape .tot{flex:1}
.rodape .tot b{font-size:20px;display:block}
.dica{font-size:13px;color:var(--mut);margin:6px 0 0}
.msg{margin-top:10px;font-size:14px}
@media (min-width:900px){.wrap{padding-top:32px}header h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="mut">Carregando…</div></div>
<div class="rodape" id="rodape" hidden><div><div class="tot"><span class="mut">Total a receber</span><b id="total">—</b></div>
  <button class="btn" onclick="sair()">Sair</button></div></div>
<script>
'use strict';
const SB_URL='https://cjieobmdpqcupzdpckef.supabase.co';
const SB_KEY='sb_publishable_B1yApF8NUHh0BRpKzoIWIQ_ukZFs9kR';
let sb=null; try{ sb=window.supabase.createClient(SB_URL,SB_KEY); }catch(e){ console.warn('supabase indisponível',e); }
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
let EU=null, LEADS=[], CONF='';

/* PURA: separa os leads nos blocos do portal e soma o que já tem valor. Sem nenhum valor registrado → total null ("—"). */
function blocos(leads){
  const b={esquentar:[],andamento:[],fechados:[],encerrados:[]};
  (leads||[]).forEach(l=>{ const k=l.etapa==='selecionado'?'esquentar':(l.etapa==='esquentado'||l.etapa==='em_atendimento')?'andamento':l.etapa==='fechado'?'fechados':l.etapa==='encerrado'?'encerrados':null; if(k) b[k].push(l); });
  Object.values(b).forEach(a=>a.sort((x,y)=>String(x.nome||'').localeCompare(String(y.nome||''),'pt-BR')));
  const comValor=b.fechados.filter(l=>l.valor!=null&&l.valor!=='');
  b.total=comValor.length?comValor.reduce((s,l)=>s+Number(l.valor),0):null;
  return b;
}

async function iniciar(){
  if(!sb){ $('#app').innerHTML='<div class="card">Sem conexão. Tente de novo em instantes.</div>'; return; }
  const {data:s}=await sb.auth.getSession();
  if(!s||!s.session) return telaLogin();
  const r=await sb.rpc('emb_portal_eu');
  if(r.error||!r.data){ return telaSemCadastro(s.session.user.email); }
  EU=r.data; await carregar();
}
async function carregar(){
  const r=await sb.from('emb_portal').select('id,nome,etapa,etapa_rotulo,valor');
  if(r.error){ $('#app').innerHTML=topo()+`<div class="card">Não consegui carregar a sua lista (${esc(r.error.message)}). <button class="btn" onclick="carregar()">Tentar de novo</button></div>`; return; }
  LEADS=r.data||[]; render();
}
function topo(){ return `<header><div style="font-size:30px">🌟</div><h1>Embaixadores da Proteção${EU?`<small>Olá, ${esc(String(EU.nome||'').split(' ')[0])}!</small>`:''}</h1></header>`; }
function telaLogin(msg){
  $('#rodape').hidden=true;
  $('#app').innerHTML=topo()+`<div class="card login">
    <b>Entrar no seu portal</b>
    <div class="mut">Digite o e-mail que você passou pro Gustavo. Chega um link de acesso — sem senha.</div>
    <input id="em" type="email" inputmode="email" autocomplete="email" placeholder="seu@email.com">
    <button class="btn btn-p" id="bt" onclick="pedirLink()">Receber link de acesso</button>
    <div class="msg" id="msg">${msg?esc(msg):''}</div></div>`;
}
async function pedirLink(){
  const em=($('#em').value||'').trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(em)){ $('#msg').textContent='Confira o e-mail.'; return; }
  $('#bt').disabled=true; $('#msg').textContent='Enviando…';
  const r=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,emailRedirectTo:location.href.split('#')[0].split('?')[0]}});
  $('#bt').disabled=false;
  $('#msg').textContent=r.error?'Não consegui enviar ('+r.error.message+'). Se ainda não recebeu o convite, fale com o Gustavo.':'✓ Link enviado pra '+em+'. Abra o e-mail neste aparelho e toque no link.';
}
function telaSemCadastro(email){
  $('#rodape').hidden=true;
  $('#app').innerHTML=topo()+`<div class="card">O e-mail <b>${esc(email)}</b> não está cadastrado como embaixador.
    <div class="mut" style="margin:8px 0 12px">Se você usa o CRM, abra pelo endereço de sempre.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="vendas.html" style="text-decoration:none;display:inline-flex;align-items:center">Abrir o CRM</a><button class="btn" onclick="sair()">Sair</button></div></div>`;
}
function linha(l,acao){
  const dir=acao==='esquentar'
    ?`<button class="btn btn-ok${CONF===l.id?' conf':''}" onclick="esquentei('${esc(l.id)}')">${CONF===l.id?'Confirmar ✓':'Esquentei'}</button>`
    :acao==='valor'?`<span class="val">${l.valor==null||l.valor===''?'—':brl(l.valor)}</span>`
    :`<span class="tag">${esc(l.etapa_rotulo||'')}</span>`;
  return `<div class="item"><div class="nm"><b>${esc(l.nome||'')}</b></div>${dir}</div>`;
}
function bloco(tit,arr,acao,vazio,dica){
  return `<section class="bloco"><h2>${tit} <span class="n">${arr.length}</span></h2>${dica?`<div class="dica" style="margin:-4px 0 8px">${dica}</div>`:''}
    <div class="lista">${arr.length?arr.map(l=>linha(l,acao)).join(''):`<div class="vazio">${vazio}</div>`}</div></section>`;
}
function render(){
  const b=blocos(LEADS);
  $('#app').innerHTML=topo()
    +bloco('🔥 Para esquentar',b.esquentar,'esquentar','Nada pra esquentar agora. Quando o Gustavo escolher novos nomes da sua lista, eles aparecem aqui.','Avise a pessoa que o Gustavo vai procurá-la e toque em <b>Esquentei</b>.')
    +bloco('⏳ Em andamento',b.andamento,'etapa','Ninguém em andamento ainda.')
    +bloco('✅ Fechados',b.fechados,'valor','Nenhum fechado ainda.')
    +(b.encerrados.length?`<details class="enc"><summary>Encerrados · ${b.encerrados.length}</summary><div class="lista">${b.encerrados.map(l=>linha(l,'etapa')).join('')}</div></details>`:'')
    +`<p class="dica" style="margin-top:18px">Você recebe 50% da comissão líquida do 1º ano de cada negócio fechado. "—" = o valor ainda não foi apurado.</p>`;
  $('#total').textContent=b.total==null?'—':brl(b.total);
  $('#rodape').hidden=false;
}
async function esquentei(id){
  if(CONF!==id){ CONF=id; render(); setTimeout(()=>{ if(CONF===id){ CONF=''; render(); } },5000); return; }
  CONF='';
  const r=await sb.rpc('emb_esquentei',{p_id:id});
  if(r.error){ alert('Não foi: '+r.error.message); }
  await carregar();
}
async function sair(){ try{ await sb.auth.signOut(); }catch(_){} EU=null; LEADS=[]; telaLogin(); }
window.pedirLink=pedirLink; window.esquentei=esquentei; window.sair=sair; window.carregar=carregar; window.portalBlocos=blocos;
if(sb) sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN'&&!EU) iniciar(); });
iniciar();
</script>
</body>
</html>
