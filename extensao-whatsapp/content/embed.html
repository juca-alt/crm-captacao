<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM · card completo</title>
<style>
html,body{margin:0;height:100%;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#0f172a}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;background:#0f172a;color:#fff;padding:6px 8px;font-size:12px}
.bar b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{border:0;border-radius:7px;background:#1e293b;color:#e2e8f0;font:inherit;font-size:12px;padding:6px 9px;cursor:pointer;min-height:30px}
.bar button:hover{background:#334155}
.palco{position:relative;flex:1;min-height:0}
iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.cobre{position:absolute;inset:0;background:#fff;padding:18px 16px;overflow:auto}
.cobre[hidden]{display:none}
.sk{border-radius:8px;background:linear-gradient(90deg,#eef2f7 25%,#e2e8f0 37%,#eef2f7 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;margin-bottom:10px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.msg{font-size:13px;color:#64748b;margin:0 0 14px;line-height:1.45}
.msg b{color:#0f172a}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes button,.acoes a{border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#0f172a;font:inherit;font-size:13px;padding:9px 12px;cursor:pointer;text-decoration:none}
.acoes .p{background:#2563eb;border-color:#2563eb;color:#fff}
</style></head>
<body>
<div class="bar"><b>Visão LP · CRM</b>
  <button id="rapido" title="Voltar pro card rápido dentro do WhatsApp">⚡ Rápido</button>
  <button id="recarregar" title="Recarregar o CRM">↻</button></div>
<div class="palco">
  <iframe id="crm" title="Ficha do negócio no CRM" allow="clipboard-write"></iframe>
  <div class="cobre" id="carregando">
    <p class="msg">⏳ <b>Abrindo o CRM…</b> <span id="carregando-q"></span></p>
    <div class="sk" style="height:22px;width:60%"></div><div class="sk" style="height:14px;width:40%"></div>
    <div class="sk" style="height:90px"></div><div class="sk" style="height:60px"></div><div class="sk" style="height:120px"></div>
  </div>
  <div class="cobre" id="falhou" hidden>
    <p class="msg">⚠️ <b>O CRM não respondeu.</b> <span id="falhou-q"></span></p>
    <div class="acoes"><button class="p" id="tentar">↻ Tentar de novo</button>
      <a id="abrir-aba" target="_blank" rel="noopener">Abrir o CRM numa aba</a></div>
  </div>
</div>
<script src="embed.js"></script>
</body></html>
