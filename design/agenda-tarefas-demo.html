<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda &amp; Tarefas · demo</title>
<style>
/* Layout: a tela Agenda & Tarefas do CRM Visão LP (mesmo visual do app e das outras demos) refeita no padrão do Global CRM:
   calendário Dia · Semana · Mês (+ a Lista de hoje), compromisso com cliente e lembrete preparado pro WhatsApp, e Tarefas em lista ou quadro. */
:root{
  color-scheme:light;
  --primary:#2563eb; --primary-2:#1d4ed8; --navy:#0f172a; --navy-2:#1e293b; --azul-claro:#eff6ff; --azul-borda:#bfdbfe;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --linha:#e2e8f0; --linha2:#cbd5e1;
  --verde:#16a34a; --verde-bg:#dcfce7; --amarelo:#b45309; --amarelo-bg:#fef3c7;
  --verm:#dc2626; --verm-bg:#fee2e2; --roxo:#7c3aed; --roxo-bg:#ede9fe; --cinza:#5b6770; --cinza-bg:#f1f5f9;
  --laranja:#c2410c; --laranja-bg:#fff7ed; --wa:#dcf8c6;
  --card:#ffffff; --fundo:#f1f5f9; --radius:12px;
  --hpx:48px; --eixo:52px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--ink);font-family:var(--font);font-size:14px;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 90px;max-width:1400px;margin:0 auto}
.demo-tag{position:fixed;top:max(8px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));z-index:70;background:#fde68a;color:#78350f;border:1px solid #f59e0b;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.03em;pointer-events:none;box-shadow:0 2px 6px rgba(15,23,42,.12)}
.demo-bar{background:var(--navy);color:#cbd5e1;border-radius:10px;padding:10px 14px;display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;font-size:13px;padding-right:170px}
.demo-bar b{color:#fff}
.sp{flex:1}
h1{font-size:22px;margin:14px 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.mut{color:var(--muted);font-size:12.5px}

/* conexão Google */
.gst{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--linha);border-radius:var(--radius);padding:8px 12px;margin-bottom:10px;font-size:13px}
.gdot{width:9px;height:9px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 3px var(--verde-bg);flex:0 0 auto}
.embreve{font-size:11px;font-weight:700;background:var(--cinza-bg);color:var(--cinza);border-radius:6px;padding:1px 6px;margin-left:4px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--linha);background:#fff;border-radius:9px;padding:6px 12px;min-height:38px;font-size:13px;color:var(--ink2);white-space:nowrap;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--primary);color:var(--ink)}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.p:hover:not(:disabled){background:var(--primary-2);color:#fff}
.btn.v{background:#16a34a;border-color:#16a34a;color:#fff}
.btn.perigo{color:var(--verm);border-color:#fecaca}
.btn.ico{min-width:38px;padding:6px 8px}
.btn:disabled{opacity:.55}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:9px;overflow:hidden;background:#fff;flex:0 0 auto}
.seg button{padding:6px 12px;min-height:38px;font-size:13px;color:var(--ink2);font-weight:600;white-space:nowrap}
.seg button+button{border-left:1px solid var(--linha)}
.seg button.on{background:var(--primary);color:#fff}

/* abas Agenda | Tarefas */
.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha2);margin:4px 0 12px}
.abas button{padding:0 16px;min-height:46px;font-weight:650;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.abas button.on{color:var(--primary-2);border-bottom-color:var(--primary)}
.abas .n{font-size:12px;font-weight:600;background:var(--azul-claro);color:var(--primary-2);border-radius:999px;padding:1px 7px}

/* KPIs + alertas */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,170px));gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--radius);padding:8px 12px}
.kpi.al{border:1.5px solid #f3c9c9}
.kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .num{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:11px;color:var(--muted)}
.alertas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.al-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:#fff;border-radius:999px;padding:5px 12px;min-height:36px;font-size:13px;color:var(--ink2);font-weight:600}
.al-chip b{font-variant-numeric:tabular-nums}
.al-chip.r{background:var(--verm-bg);border-color:#fecaca;color:#991b1b}
.al-chip.a{background:var(--amarelo-bg);border-color:#fde68a;color:var(--amarelo)}
.al-chip.l{background:var(--laranja-bg);border-color:#fed7aa;color:var(--laranja)}
.al-chip:hover{filter:brightness(.97)}

/* barra de ferramentas */
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.nav{display:inline-flex;align-items:center;gap:6px}
.per{font-weight:700;font-size:15px;white-space:nowrap;margin-left:4px}
.leg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:#fff;border-radius:999px;padding:4px 11px;min-height:32px;font-size:12.5px;color:var(--ink2)}
.lg .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.lg.off{opacity:.45;text-decoration:line-through}
.so-m{display:none!important}

/* tira da semana (celular) */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:8px}
.strip button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;border-radius:10px;background:#fff;border:1px solid var(--linha);font-size:11px;color:var(--muted);text-align:center}
.strip button b{font-size:16px;color:var(--ink)}
.strip button .dots{display:flex;gap:2px;height:6px}
.strip button .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.strip button.hoje b{color:var(--primary)}
.strip button.sel{background:var(--primary);border-color:var(--primary);color:#dbeafe}
.strip button.sel b{color:#fff}
.strip button.sel .dots i{background:#fff!important}
.strip button.faixa{background:var(--azul-claro);border-color:var(--azul-borda)}

/* grade de horas */
.grade{background:var(--card);border:1px solid var(--linha);border-radius:var(--radius);overflow:clip}
.g-hd,.g-ad,.g-body{display:grid;grid-template-columns:var(--eixo) repeat(var(--n),minmax(0,1fr))}
.g-hd{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--linha)}
.g-dh{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:8px 4px;min-height:44px;border-left:1px solid var(--linha);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.g-dh b{font-size:18px;color:var(--ink);letter-spacing:0}
.g-dh.hoje b{background:var(--primary);color:#fff;border-radius:999px;min-width:30px;display:inline-block;text-align:center;padding:0 6px}
.g-dh:hover{background:var(--fundo)}
.g-ad{border-bottom:1px solid var(--linha);background:#fbfcfe}
.g-ad>.g-ax{font-size:10.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.g-adc{border-left:1px solid var(--linha);padding:4px;display:flex;flex-wrap:wrap;gap:4px;min-height:34px;align-content:flex-start}
.adc{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:11.5px;background:var(--cinza-bg);color:var(--ink2);border:1px solid var(--linha);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:24px}
.adc.tar{background:#fff7ed;border-color:#fed7aa;color:var(--laranja)}
.adc.tar.at{background:var(--verm-bg);border-color:#fecaca;color:#991b1b}
.adc.aniv{background:#fdf2f8;border-color:#fbcfe8;color:#9d174d}
.g-ax{position:relative}
.g-body .g-ax{height:calc(var(--hpx) * var(--nh))}
.g-hr{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.g-col{position:relative;border-left:1px solid var(--linha);height:calc(var(--hpx) * var(--nh));cursor:cell;
  background-image:linear-gradient(to bottom,var(--linha) 1px,transparent 1px),linear-gradient(to bottom,#f1f5f9 1px,transparent 1px);
  background-size:100% var(--hpx),100% calc(var(--hpx) / 2);background-position:0 0,0 calc(var(--hpx) / 2)}
.g-col.hoje{background-color:#f8fbff}
.g-col.fds{background-color:#fafafa}
.g-col.drop{background-color:var(--azul-claro)}
.ev{position:absolute;z-index:2;border-radius:7px;border-left:4px solid var(--c);background:var(--bg);color:var(--ink);padding:2px 6px;font-size:12px;line-height:1.25;overflow:hidden;text-align:left;box-shadow:0 1px 2px rgba(15,23,42,.10);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;cursor:pointer;touch-action:manipulation}
.ev:hover{box-shadow:0 3px 10px rgba(15,23,42,.18);z-index:3}
.ev .eh{font-size:11px;font-variant-numeric:tabular-nums;opacity:.85;white-space:nowrap}
.ev b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--ink)}
.ev .et{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--ink2)}
.ev .elb{position:absolute;top:2px;right:4px;font-size:12px}
.ev.curto{flex-direction:row;gap:5px;align-items:center}
.ev.feito{opacity:.5}.ev.feito b{text-decoration:line-through}
.ev.afin{outline:2px dashed var(--verm);outline-offset:-2px}
.ev.google{background:repeating-linear-gradient(135deg,#f8fafc 0 6px,#eef2f6 6px 12px)}
.ev.arrastando{opacity:.85;box-shadow:0 8px 24px rgba(15,23,42,.3);z-index:9;cursor:grabbing}
.agora{position:absolute;left:0;right:0;height:2px;background:#ef4444;z-index:4;pointer-events:none}
.agora::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ef4444}
.ghost{position:absolute;left:3px;right:3px;height:calc(var(--hpx) / 2);border:1.5px dashed var(--primary);border-radius:7px;background:rgba(37,99,235,.07);color:var(--primary-2);font-size:12px;font-weight:600;padding:2px 6px;pointer-events:none;display:none;z-index:1}
.dia-wrap{display:flex;gap:12px;align-items:flex-start}
.dia-wrap .grade{flex:1;min-width:0}
.lado{flex:0 0 300px;display:flex;flex-direction:column;gap:10px;position:sticky;top:8px}
.cx{background:var(--card);border:1px solid var(--linha);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cx h3{margin:0;font-size:14px}
.cx .vz{font-size:12.5px;color:var(--muted)}

/* mês */
.mes{background:var(--card);border:1px solid var(--linha);border-radius:var(--radius);overflow:hidden}
.mes-hd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--linha);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.mes-hd span{padding:8px;text-align:center}
.mes-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc{min-height:118px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:4px;display:flex;flex-direction:column;gap:3px;cursor:cell;position:relative}
.mc:nth-child(7n){border-right:0}
.mc.fora{background:#fafbfc}.mc.fora .mn{color:#94a3b8}
.mc:hover{background:#f8fbff}
.mc .mn{align-self:flex-start;font-weight:700;font-size:13px;min-width:28px;min-height:26px;border-radius:999px;padding:0 6px;color:var(--ink)}
.mc .mn:hover{background:var(--azul-claro)}
.mc.hoje .mn{background:var(--primary);color:#fff}
.mch{display:flex;align-items:center;gap:4px;border-radius:5px;padding:1px 5px;font-size:11.5px;background:var(--bg);color:var(--ink);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px;text-align:left}
.mch.feito{opacity:.5;text-decoration:line-through}
.mch .h{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:11px}
.mais{font-size:11.5px;color:var(--primary-2);font-weight:600;align-self:flex-start;padding:0 4px;min-height:20px}
.mc .mplus{position:absolute;right:6px;top:4px;color:var(--primary);font-weight:700;opacity:0}
.mc:hover .mplus{opacity:1}
/* mês no celular */
.mm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--card);border:1px solid var(--linha);border-radius:var(--radius);padding:6px}
.mm .wd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.mm button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;border-radius:10px;font-weight:650;font-size:14px;color:var(--ink)}
.mm button.fora{color:#94a3b8;font-weight:500}
.mm button.hoje{color:var(--primary)}
.mm button.sel{background:var(--primary);color:#fff}
.mm button .dots{display:flex;gap:2px;height:6px}
.mm button .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.mm button.sel .dots i{background:#fff!important}
.dl{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.dl h3{margin:4px 2px;font-size:14px}
.dl-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--linha);border-left:4px solid var(--c);border-radius:10px;padding:8px 12px;min-height:52px;width:100%;text-align:left}
.dl-row .h{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px}
.dl-row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.dl-row .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-row .t span{font-size:12px;color:var(--muted)}
.dl-row.feito{opacity:.55}

/* lista (modo de hoje) */
.bl{background:var(--card);border:1px solid var(--linha);border-radius:var(--radius);margin-bottom:8px}
.bl-hw{display:flex;align-items:stretch}
.bl-h{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px;text-align:left}
.bl-h .car{color:var(--muted);font-size:12px;width:12px}
.bl-h .bl-t{font-weight:650;white-space:nowrap}
.bl-h .bl-r{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-h .bl-r .vm{color:var(--verm);font-weight:600}
.bl-novo{margin:6px 8px 6px 0;align-self:center}
.bl-b{border-top:1px solid var(--linha);padding:6px 12px 10px}
.bl .bl{margin:8px 0 0;background:#fbfcfe}
.lin{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linha)}
.lin:last-child{border-bottom:0}
.lin-ic{width:28px;height:28px;border-radius:8px;background:var(--bg,#f1f5f9);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.lin-m{min-width:0}
.lin-n{font-weight:650;text-decoration:underline dotted;text-underline-offset:3px;min-height:28px;text-align:left}
.lin-s{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:2px}
.lin-q{font-size:12.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.lin-q.at{color:var(--verm);font-weight:600}.lin-q.hj{color:var(--primary-2);font-weight:600}
.lin-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lin.afin{background:linear-gradient(90deg,#fff5f5,transparent)}
.vazio{font-size:12.5px;color:var(--muted);padding:10px 0}
select.acao{border:1px solid var(--linha);border-radius:9px;padding:6px 8px;min-height:38px;background:#fff;font-size:13px;color:var(--ink2)}

/* selos */
.bd{display:inline-flex;align-items:center;gap:4px;font-size:11px;border-radius:6px;padding:2px 6px;background:var(--cinza-bg);color:var(--cinza);white-space:nowrap;font-weight:600}
.bd.tp{background:var(--bg);color:var(--ink);border-left:3px solid var(--c)}
.bd.et{background:var(--azul-claro);color:var(--primary-2)}
.bd.vt{background:var(--roxo-bg);color:var(--roxo)}
.lb{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:999px;padding:2px 8px;font-weight:600;white-space:nowrap}
.lb-ag{background:#f1f5f9;color:#475569}
.lb-pr{background:#e0f2fe;color:#075985}
.lb-aw{background:var(--amarelo-bg);color:var(--amarelo)}
.lb-ok{background:var(--verde-bg);color:#15803d}
.lb-rm{background:var(--laranja-bg);color:var(--laranja);border:1px solid #fed7aa}
.lb-env{background:#f1f5f9;color:#15803d}

/* tarefas */
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;background:var(--card);border:1px solid var(--linha);border-left:4px solid var(--pc);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.trow.at{background:#fff8f8;border-color:#fecaca;border-left-color:var(--verm)}
.ckb{width:30px;height:30px;border-radius:8px;border:2px solid var(--linha2);display:inline-flex;align-items:center;justify-content:center;color:transparent;font-weight:800;background:#fff}
.ckb:hover{border-color:var(--verde);color:#bbf7d0}
.ckb.on{background:var(--verde);border-color:var(--verde);color:#fff}
.tnome{font-weight:650;font-size:14px;text-align:left;min-height:28px}
.tnome:hover{color:var(--primary-2);text-decoration:underline}
.trow.feita .tnome{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.tvenc{font-weight:600;color:var(--ink2)}.tvenc.at{color:var(--verm)}.tvenc.hj{color:var(--primary-2)}
.pr{font-size:11px;border-radius:6px;padding:1px 7px;font-weight:700}
.pr.alta{background:var(--verm-bg);color:#991b1b}.pr.media{background:var(--amarelo-bg);color:var(--amarelo)}.pr.baixa{background:var(--cinza-bg);color:var(--cinza)}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:800;color:#fff;background:var(--primary);flex:0 0 auto}
.av.v{background:var(--roxo)}
.tact{display:flex;gap:6px;align-items:center}
.ckl{grid-column:2/-1;display:flex;flex-direction:column;gap:2px;padding:4px 0 2px}
.cki{display:flex;align-items:center;gap:8px;min-height:32px;text-align:left;font-size:13px;border-radius:8px;padding:0 6px}
.cki:hover{background:var(--fundo)}
.cki .bx{width:18px;height:18px;border-radius:5px;border:2px solid var(--linha2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex:0 0 auto}
.cki.ok .bx{background:var(--verde);border-color:var(--verde)}
.cki.ok span:last-child{text-decoration:line-through;color:var(--muted)}
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.kc{background:#e9eef4;border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:220px;transition:background .15s}
.kc.drop{outline:2px dashed var(--primary);outline-offset:-2px;background:var(--azul-claro)}

function lanes(evs){ const out=[]; let grupo=[], fimG=-1;
  const fecha=()=>{ const ls=[]; grupo.forEach(x=>{ let i=ls.findIndex(f=>f<=x.s); if(i<0){ i=ls.length; ls.push(0);} ls[i]=x.f; x.lane=i; }); grupo.forEach(x=>{ x.nl=ls.length; out.push(x); }); grupo=[]; };
  evs.map(e=>({e,s:m2(e.h),f:m2(e.h)+e.dur})).sort((a,b)=>a.s-b.s||b.f-a.f).forEach(x=>{ if(grupo.length&&x.s>=fimG) fecha(); grupo.push(x); fimG=Math.max(fimG,x.f); });
  if(grupo.length) fecha(); return out; }

    ${d===HOJE&&fin.length?`<div class="cx"><h3>🤝 A finalizar <span class="mut">${fin.length}</span></h3>${fin.map(e=>`<div class="srow"><div class="t"><b>${esc(nomeEv(e))}</b><span class="mut">${TIPOS[e.tipo].l} · ${quandoTxt(e.d,e.h)}</span></div><button class="btn p" onclick="abrir(()=>shFinalizar('${e.id}'))">Finalizar</button></div>`).join('')}</div>`:''}
    <div class="cx"><h3>Resumo do dia</h3><div class="mut">${evs.filter(e=>TIPOS[e.tipo].reun).length} reunião(ões) · ${evs.filter(e=>e.tipo==='ligar').length} ligação(ões) · ${evs.filter(e=>e.tipo==='entrega').length} entrega(s)</div>
      <div class="mut">${evs.filter(e=>lembEstado(e)==='confirmou').length} confirmada(s) · ${evs.filter(e=>lembEstado(e)==='aguardando').length} aguardando resposta</div></div></aside>`; }
function tarMini(t){ return `<div class="srow"><button class="ckb${t.st==='concluida'?' on':''}" role="checkbox" aria-checked="${t.st==='concluida'}" aria-label="Concluir: ${esc(t.tit)}" onclick="tarFeita('${t.id}')">✓</button><div class="t"><button class="tnome" onclick="abrir(()=>shTarefa('${t.id}'))">${esc(t.tit)}</button><div class="tmeta">${t.c?'👤 '+esc(P[t.c].nome)+' · ':''}<span class="tvenc${tarAt(t)?' at':''}">${tarVencTxt(t)}</span></div></div></div>`; }

/* mês */
function mesCelulas(){ const D=dt(ST.cur); const pri=isoD(new Date(D.getFullYear(),D.getMonth(),1)); const ini=segDa(pri); const out=[];
  for(let i=0;i<42;i++){ const d=add(ini,i); if(i>=35&&dt(d).getMonth()!==D.getMonth()) break; out.push({d,fora:dt(d).getMonth()!==D.getMonth()}); } return out; }
function mesHTML(){ const cs=mesCelulas();
  return `<div class="mes"><div class="mes-hd">${['seg','ter','qua','qui','sex','sáb','dom'].map(x=>`<span>${x}</span>`).join('')}</div><div class="mes-g">${cs.map(({d,fora})=>{ const evs=evDia(d); const an=ANIV.filter(a=>a.d===d);
    return `<div class="mc${fora?' fora':''}${d===HOJE?' hoje':''}" onclick="cliqueMes(event,'${d}')" title="Toque no vazio pra marcar neste dia"><button class="mn" onclick="event.stopPropagation();irDia('${d}')" aria-label="Abrir ${br(d)}">${dt(d).getDate()}</button><span class="mplus">＋</span>
      ${an.map(a=>`<span class="mch" style="--c:#db2777;--bg:#fdf2f8">🎂 ${esc(pn(a.c))}</span>`).join('')}
      ${evs.slice(0,3).map(e=>`<button class="mch${e.feito?' feito':''}" style="${sty(TIPOS[e.tipo])}" onclick="event.stopPropagation();abrir(()=>shEvento('${e.id}'))"><span class="h">${e.h}</span> ${esc(e.c?pn(e.c):e.tit)}${lembIco(e)?' '+lembIco(e):''}</button>`).join('')}
      ${evs.length>3?`<button class="mais" onclick="event.stopPropagation();irDia('${d}')">+${evs.length-3} mais</button>`:''}</div>`; }).join('')}</div></div>`; }
function mesMobHTML(){ const cs=mesCelulas(); const d0=ST.cur; const evs=evDia(d0); const ts=visTipo('tarefa')?TAR.filter(t=>t.st!=='concluida'&&t.venc===d0):[];
  return `<div class="mm">${['S','T','Q','Q','S','S','D'].map(x=>`<span class="wd">${x}</span>`).join('')}${cs.map(({d,fora})=>{ const e=evDia(d);
    return `<button class="${fora?'fora ':''}${d===HOJE?'hoje ':''}${d===d0?'sel':''}" onclick="ST.cur='${d}';render()" aria-label="${br(d)}, ${e.length} compromissos">${dt(d).getDate()}<span class="dots">${e.slice(0,4).map(x=>`<i style="--c:${TIPOS[x.tipo].cor}"></i>`).join('')}</span></button>`; }).join('')}</div>
  <div class="dl"><h3>${d0===HOJE?'Hoje · ':''}${DSL[dow(d0)]}, ${br(d0)}</h3>
    ${evs.map(e=>`<button class="dl-row${e.feito?' feito':''}" style="${sty(TIPOS[e.tipo])}" onclick="abrir(()=>shEvento('${e.id}'))"><span class="h">${e.h}</span><span class="t"><b>${TIPOS[e.tipo].google?'':TIPOS[e.tipo].ico+' '}${esc(nomeEv(e))}</b><span>${esc(TIPOS[e.tipo].l)} · ${durTxt(e.dur)}</span></span>${lembIco(e)}</button>`).join('')}
    ${ts.map(t=>`<button class="dl-row" style="--c:#c2410c" onclick="abrir(()=>shTarefa('${t.id}'))"><span class="h">☑️</span><span class="t"><b>${esc(t.tit)}</b><span>tarefa${t.c?' · '+esc(P[t.c].nome):''}</span></span></button>`).join('')}
    ${!evs.length&&!ts.length?'<div class="vazio">Nada marcado neste dia.</div>':''}
    <div style="display:flex;gap:8px"><button class="btn p" style="flex:1" onclick="abrir(()=>shNovo({d:'${d0}',h:'09:00'}))">＋ Marcar neste dia</button><button class="btn" style="flex:1" onclick="irDia('${d0}')">Ver o dia na grade</button></div></div>`; }

/* lista (modo de hoje, mantido) */
function faixa(d){ if(!d) return 'semdata'; if(d<HOJE) return 'atrasada'; if(d===HOJE) return 'hoje'; if(d===add(HOJE,1)) return 'amanha'; return d<=add(HOJE,7)?'semana':'semanas'; }
const FAIXAS=[['atrasada','⚠️ Atrasadas',null],['hoje','📌 Hoje',0],['amanha','→ Amanhã',1],['semana','🗓️ Próxima semana',2],['semanas','📆 Próximas semanas',8],['semdata','• Sem data',null]];
function bloco(k,tit,res,corpo,novoDia){ const ab=!!ST.dobras[k];
  return `<div class="bl"><div class="bl-hw"><button class="bl-h" aria-expanded="${ab}" onclick="dobra('${k}')"><span class="car">${ab?'▾':'▸'}</span><span class="bl-t">${tit}</span><span class="bl-r">${res}</span></button>${novoDia!=null?`<button class="btn p bl-novo" onclick="abrir(()=>shNovo({d:'${add(HOJE,novoDia)}',h:'09:00'}))" title="Novo já neste dia">＋ Novo</button>`:''}</div>${ab?`<div class="bl-b">${corpo}</div>`:''}</div>`; }
const nomes3=l=>{ const t=l.slice(0,3).join(' · '); return t?' · '+esc(t)+(l.length>3?' …':''):''; };
function listaHTML(){
  const evAb=EV.filter(e=>eCRM(e)&&!e.feito), tAb=tarAbertas(); const out=[];
  out.push(bloco('solic','📨 Solicitações em acompanhamento',`<b>${SOLIC.length}</b> com o Victor${nomes3(SOLIC.map(s=>pn(s.c)))}`,SOLIC.map(s=>`<div class="lin"><span class="lin-ic">📨</span><div class="lin-m"><b>${esc(s.t)}</b><div class="lin-s"><span class="bd">${esc(P[s.c].nome)}</span><span class="bd vt">com o Victor</span></div></div><span class="lin-q">desde ${br(s.desde)}</span><div class="lin-a"></div></div>`).join('')));
  FAIXAS.forEach(([k,tit,nd])=>{
    const ev=evAb.filter(e=>faixa(e.d)===k).sort((a,b)=>(a.d+a.h).localeCompare(b.d+b.h)); const ts=tAb.filter(t=>faixa(t.venc)===k).sort((a,b)=>a.venc.localeCompare(b.venc));
    const fin=ev.filter(aFinalizar).length;
    if(!ev.length&&!ts.length&&nd==null) return;
    const subE=bloco(k+'-evt','📅 Eventos',`<b>${ev.length}</b>${fin?` · <span class="vm">${fin} a finalizar</span>`:''}${nomes3(ev.map(e=>pn(e.c)))}`,ev.length?ev.map(linhaEv).join(''):'<div class="vazio">Nada marcado.</div>');
    const subT=bloco(k+'-tar','☑️ Tarefas',`<b>${ts.length}</b>${nomes3(ts.map(t=>t.c?pn(t.c):t.tit.split(' ')[0]))}`,ts.length?ts.map(t=>tarLinha(t,true)).join(''):'<div class="vazio">Nada marcado.</div>');
    out.push(bloco(k,tit,`<b>${ev.length+ts.length}</b> · 📅 ${ev.length} · ☑️ ${ts.length}${fin?` · <span class="vm">🤝 ${fin} a finalizar</span>`:''}`,subE+subT,nd));
    if(k==='semana') out.push(bloco('aniv','🎂 Aniversariantes',`<b>${ANIV.length}</b> nos próximos 7 dias${nomes3(ANIV.map(a=>pn(a.c)))}`,ANIV.map(anivLinha).join('')));
  });
  out.push(bloco('semativ','💤 Sem próxima atividade',`<b>${SEM_PROX.length}</b> · negócio parado é o que mais custa`,SEM_PROX.map(semLinha).join('')));
  return out.join('')+`<div class="mut" style="margin-top:6px">⋮⋮ organizar (mudar a ordem / esconder seções) continua como hoje.</div>`; }
function linhaEv(e){ const t=TIPOS[e.tipo], c=P[e.c], afin=aFinalizar(e), at=atrasadoEv(e);
  const q=afin?br(e.d)+' · '+entre(e.d,HOJE)+'d sem desfecho':at?br(e.d)+' · atrasada '+entre(e.d,HOJE)+'d':quandoTxt(e.d,e.h);
  return `<div class="lin${afin?' afin':''}"><span class="lin-ic" style="${sty(t)}" title="${esc(t.l)}">${t.ico}</span>
    <div class="lin-m"><button class="lin-n" onclick="abrir(()=>shEvento('${e.id}'))">${esc(c?c.nome:e.tit)}</button>
      <div class="lin-s"><span class="bd tp" style="${sty(t)}">${t.l}</span>${c?`<span class="bd et">${esc(c.et)}</span>`:''}${chipLemb(e)}${e.por==='victor'?'<span class="bd vt">marcado pelo Victor</span>':''}</div></div>
    <span class="lin-q ${afin||at?'at':e.d===HOJE?'hj':''}">${q}</span>
    <div class="lin-a">${afin?`<button class="btn p" onclick="abrir(()=>shFinalizar('${e.id}'))">Finalizar</button>`:''}
      <button class="btn ico" onclick="abrir(()=>shMandar('${e.id}','${lembEstado(e)==='pronto'?'lembrete':'compromisso'}'))" title="WhatsApp com o texto pronto" aria-label="WhatsApp">💬</button>
      ${selAcao(e,afin)}
      <button class="btn ico" onclick="abrir(()=>shNovo({editId:'${e.id}'}))" title="Editar" aria-label="Editar">✏️</button></div></div>`; }
function selAcao(e,afin){ const ops=[['feita','✓ Feita'],['delay','⏳ Delay 7d (cliente pediu pra adiar)'],['mais1','📅 +1 dia'],['mais7','📅 +7 dias'],['reag','🔁 Reagendar e avisar'],['remover','✕ Remover']].filter(o=>!(afin&&o[0]==='feita'));
  return `<select class="acao" aria-label="Ação" onchange="acaoEv('${e.id}',this.value);this.value=''"><option value="">${afin?'Mais…':'Ação…'}</option>${ops.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`; }
function anivLinha(a){ return `<div class="lin"><span class="lin-ic">🎂</span><div class="lin-m"><b>${esc(P[a.c].nome)}</b><div class="lin-s"><span class="bd">${quandoTxt(a.d)}</span></div></div><span class="lin-q">${br(a.d)}</span><div class="lin-a"><button class="btn v" onclick="abrir(()=>shMandarTxt('${a.c}','Feliz aniversário, ${esc(pn(a.c))}! 🎉 Muita saúde e um ano incrível. — Gustavo'))">💬 parabéns</button></div></div>`; }
function semLinha(k){ return `<div class="lin"><span class="lin-ic">💤</span><div class="lin-m"><button class="lin-n" onclick="ficha('${k}')">${esc(P[k].nome)}</button><div class="lin-s"><span class="bd et">${esc(P[k].et)}</span></div></div><span class="lin-q"></span><div class="lin-a"><button class="btn p" onclick="abrir(()=>shNovo({c:'${k}',d:'${add(HOJE,1)}',h:'10:00',tipo:'${PROX_TIPO[P[k].et]==='entrega'?'ligar':(PROX_TIPO[P[k].et]||'ligar')}',banner:'Próxima atividade de ${esc(pn(k))}'}))">＋ próxima atividade</button></div></div>`; }

/* ════════════ TAREFAS ════════════ */
function tarVis(){ return TAR.filter(t=>ST.tarResp==='todas'||t.resp===(ST.tarResp==='minhas'?'eu':'victor')); }
function tarVencTxt(t){ if(!t.venc) return 'sem vencimento'; if(tarAt(t)) return br(t.venc)+' · atrasada '+entre(t.venc,HOJE)+'d'; return 'vence '+quandoTxt(t.venc); }
function tarOrd(a,b){ const pa={alta:0,media:1,baixa:2}; return (tarAt(b)-tarAt(a))||((a.venc||'9999').localeCompare(b.venc||'9999'))||(pa[a.prio]-pa[b.prio]); }
function tarefasHTML(){
  const vis=tarVis(), ab=vis.filter(t=>t.st!=='concluida'), at=ab.filter(tarAt).length, hj=ab.filter(t=>t.venc===HOJE).length;
  const k=`<div class="kpis"><div class="kpi${at?' al':''}"><div class="lbl">Atrasadas</div><div class="num">${at}</div><div class="ks">venceram e seguem abertas</div></div>
    <div class="kpi"><div class="lbl">Vencem hoje</div><div class="num">${hj}</div><div class="ks">pra resolver hoje</div></div>
    <div class="kpi"><div class="lbl">Abertas</div><div class="num">${ab.length}</div><div class="ks">${ab.filter(t=>t.st==='andamento').length} em andamento</div></div></div>`;
  const tb=`<div class="tb">
    <div class="seg" role="group" aria-label="De quem">${[['todas','Todas'],['minhas','Minhas'],['victor','Do Victor']].map(x=>`<button aria-pressed="${ST.tarResp===x[0]}" class="${ST.tarResp===x[0]?'on':''}" onclick="ST.tarResp='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="Como ver">${[['lista','☰ Lista'],['quadro','▦ Quadro']].map(x=>`<button aria-pressed="${ST.tarModo===x[0]}" class="${ST.tarModo===x[0]?'on':''}" onclick="ST.tarModo='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
    <span class="sp so-d"></span><button class="btn p so-d" onclick="abrir(()=>shTarefa(null))">＋ Nova tarefa</button></div>`;
  return k+tb+(ST.tarModo==='lista'?tarListaHTML(vis):tarQuadroHTML(vis));
}
function tarLinha(t,naAgenda){ const n=t.ck.length, ok=t.ck.filter(x=>x.ok).length, ckab=!!ST.ckAb[t.id];
  return `<div class="trow${tarAt(t)?' at':''}${t.st==='concluida'?' feita':''}" style="--pc:${PRIO[t.prio][1]}">
    <button class="ckb${t.st==='concluida'?' on':''}" role="checkbox" aria-checked="${t.st==='concluida'}" aria-label="Concluir: ${esc(t.tit)}" onclick="tarFeita('${t.id}')">✓</button>
    <div><button class="tnome" onclick="abrir(()=>shTarefa('${t.id}'))">${esc(t.tit)}</button>
      <div class="tmeta"><span class="pr ${t.prio}">${PRIO[t.prio][0]}</span><span class="tvenc${tarAt(t)?' at':t.venc===HOJE?' hj':''}">${tarVencTxt(t)}</span>${t.c?`<span>👤 ${esc(P[t.c].nome)}</span>`:''}<span class="av${t.resp==='victor'?' v':''}" title="${t.resp==='victor'?'Victor':'Você'}">${t.resp==='victor'?'V':'G'}</span>${naAgenda?'':`<span>${TST.find(s=>s[0]===t.st)[1]}</span>`}</div></div>
    <div class="tact">${n?`<button class="btn" aria-expanded="${ckab}" onclick="ST.ckAb['${t.id}']=!ST.ckAb['${t.id}'];render()" title="Checklist"><span class="prog" style="--p:${Math.round(ok/n*100)}%">☑ ${ok}/${n} <i></i></span></button>`:''}
      ${t.st!=='concluida'?`<button class="btn" onclick="abrir(()=>shMover('${t.id}'))">Mover ▸</button>`:''}</div>
    ${n&&ckab?`<div class="ckl">${t.ck.map((x,i)=>`<button class="cki${x.ok?' ok':''}" role="checkbox" aria-checked="${x.ok}" onclick="ckTg('${t.id}',${i})"><span class="bx">${x.ok?'✓':''}</span><span>${esc(x.t)}</span></button>`).join('')}</div>`:''}</div>`; }
function tarListaHTML(vis){ const ab=vis.filter(t=>t.st!=='concluida').sort(tarOrd), fe=vis.filter(t=>t.st==='concluida');
  return (ab.length?ab.map(t=>tarLinha(t)).join(''):'<div class="vazio">Nenhuma tarefa aberta. 🎉</div>')
    +bloco('tar-feitas','✓ Concluídas',`<b>${fe.length}</b>${nomes3(fe.map(t=>t.tit.split(' ')[0]))}`,fe.length?fe.map(t=>tarLinha(t)).join(''):'<div class="vazio">Nenhuma ainda.</div>'); }
function tarQuadroHTML(vis){ const mob=M(), drag=!mob;
  const tabs=`<div class="ktabs" role="tablist">${TST.map(s=>`<button role="tab" aria-selected="${ST.ktab===s[0]}" class="${ST.ktab===s[0]?'on':''}" onclick="ST.ktab='${s[0]}';render()">${s[1]} · ${vis.filter(t=>t.st===s[0]).length}</button>`).join('')}</div>`;
  return tabs+`<div class="kb">${TST.map(([k,l,cor])=>{ const ts=vis.filter(t=>t.st===k).sort(tarOrd);
    return `<div class="kc${ST.ktab===k?' vis':''}" data-st="${k}" ondragover="kOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="kDrop(event,'${k}')">
      <div class="kc-h"><span class="dot" style="background:${cor}"></span><b>${l}</b><span class="q">${ts.length}</span></div>
      ${ts.map(t=>{ const n=t.ck.length, ok=t.ck.filter(x=>x.ok).length;
        return `<div class="kcard${tarAt(t)?' at':''}" style="--pc:${PRIO[t.prio][1]}" ${drag?`draggable="true" ondragstart="kStart(event,'${t.id}')" ondragend="this.classList.remove('arr')"`:''} data-id="${t.id}">
          <button class="kt" onclick="abrir(()=>shTarefa('${t.id}'))">${esc(t.tit)}</button>
          <div class="kf">${t.c?`<span>👤 ${esc(P[t.c].nome)}</span>`:'<span>sem negócio ligado</span>'}</div>
          <div class="kf"><span class="pr ${t.prio}">${PRIO[t.prio][0]}</span><span class="tvenc${tarAt(t)?' at':t.venc===HOJE?' hj':''}">${tarVencTxt(t)}</span></div>
          <div class="kf"><span class="av${t.resp==='victor'?' v':''}" title="${t.resp==='victor'?'Victor':'Você'}">${t.resp==='victor'?'V':'G'}</span>${n?`<span class="prog" style="--p:${Math.round(ok/n*100)}%">☑ ${ok}/${n} <i></i></span>`:''}<span class="sp"></span><button class="btn" onclick="abrir(()=>shMover('${t.id}'))" title="Mover pra outra coluna">Mover ▸</button></div></div>`; }).join('')||'<div class="kvz">Nada aqui.'+(drag?' Arraste um cartão pra cá.':'')+'</div>'}
      ${k==='pendente'?`<button class="btn" onclick="abrir(()=>shTarefa(null))">＋ tarefa</button>`:''}</div>`; }).join('')}</div>
    ${drag?'<div class="mut" style="margin-top:8px">No computador: arraste o cartão entre as colunas. No celular: botão "Mover ▸".</div>':''}`; }

/* ════════════ ações ════════════ */
function irAba(a){ ST.aba=a; render(); }
function irModo(m){ ST.modo=m; render(); }
function irDia(d){ ST.cur=d; ST.modo='dia'; ST.aba='agenda'; fecharTudo(); render(); scrollTo({top:document.querySelector('.tb').offsetTop-8}); }
function irHoje(){ ST.cur=HOJE; render(); }
function navegar(n){ if(ST.modo==='dia') ST.cur=add(ST.cur,n); else if(ST.modo==='semana') ST.cur=add(ST.cur,n*(M()?3:7)); else { const D=dt(ST.cur); ST.cur=isoD(new Date(D.getFullYear(),D.getMonth()+n,1)); } render(); }
function tgTipo(k){ ST.ocultos.has(k)?ST.ocultos.delete(k):ST.ocultos.add(k); render(); }
function dobra(k){ ST.dobras[k]=!ST.dobras[k]; render(); }
function ficha(k){ toast('No app, abre a ficha de '+P[k].nome+'.'); }
function fabNovo(){ if(ST.aba==='agenda') abrir(()=>shNovo({d:ST.cur>=HOJE?ST.cur:HOJE,h:'09:00'})); else abrir(()=>shTarefa(null)); }
function cliqueSlot(ev,d){ if(ev.target.closest('.ev')) return; const col=ev.currentTarget, r=col.getBoundingClientRect(), hpx=r.height/(H1-H0);
  let min=H0*60+Math.floor((ev.clientY-r.top)/hpx*2)*30; min=Math.max(H0*60,Math.min(H1*60-30,min)); abrir(()=>shNovo({d,h:hm(min)})); }
function fantasma(ev){ if(M()||ARR) return; const col=ev.currentTarget, g=col.querySelector('.ghost'); if(!g) return; if(ev.target.closest('.ev')){ g.style.display='none'; return; }
  const r=col.getBoundingClientRect(), hpx=r.height/(H1-H0); const slot=Math.floor((ev.clientY-r.top)/hpx*2); const min=H0*60+slot*30;
  g.style.display='block'; g.style.top=(slot*hpx/2)+'px'; g.textContent='＋ '+hm(min); }
function fantasmaSai(col){ const g=col.querySelector('.ghost'); if(g) g.style.display='none'; }
function cliqueMes(ev,d){ if(ev.target.closest('button')) return; abrir(()=>shNovo({d,h:'09:00'})); }
let ARR=null, ARR_FIM=0;
function cliqueEv(ev,id){ ev.stopPropagation(); if(Date.now()-ARR_FIM<300) return; abrir(()=>shEvento(id)); }
function acaoEv(id,k){ const e=EV.find(x=>x.id===id); if(!e||!k) return;
  if(k==='feita'){ e.feito=true; toast('Feito: '+TIPOS[e.tipo].l+' · '+nomeEv(e)); render(); }
  else if(k==='delay'||k==='mais7'){ const base=e.d<HOJE?HOJE:e.d; e.d=add(base,7); if(e.lemb) e.lemb.st=null; toast((k==='delay'?'Delay: ':'Adiado: ')+nomeEv(e)+' → '+quandoTxt(e.d,e.h)); render(); }

/* quadro: arrastar (computador) */
let KDRAG=null;
function kStart(ev,id){ KDRAG=id; ev.dataTransfer.effectAllowed='move'; try{ ev.dataTransfer.setData('text/plain',id); }catch(_){} ev.currentTarget.classList.add('arr'); }
function kOver(ev,el){ if(!KDRAG) return; ev.preventDefault(); el.classList.add('drop'); }

/* agenda: arrastar o evento pra mudar hora/dia (computador, mouse) */
function ligarArraste(){ if(M()) return; document.querySelectorAll('.ev[data-id]').forEach(el=>{ el.addEventListener('pointerdown',evDown); }); }
function evDown(pe){ if(pe.pointerType!=='mouse'||pe.button!==0) return; const el=pe.currentTarget, e=EV.find(x=>x.id===el.dataset.id); if(!e||e.feito) return;
  const r=el.getBoundingClientRect(); ARR={el,e,x0:pe.clientX,y0:pe.clientY,dy:pe.clientY-r.top,mov:false,d:e.d,min:m2(e.h)};
  window.addEventListener('pointermove',evMove); window.addEventListener('pointerup',evUp,{once:true}); }
function evMove(pe){ const a=ARR; if(!a) return; if(!a.mov&&Math.hypot(pe.clientX-a.x0,pe.clientY-a.y0)<5) return; a.mov=true; a.el.classList.add('arrastando');
  const col=document.elementsFromPoint(pe.clientX,pe.clientY).find(n=>n.classList&&n.classList.contains('g-col')); if(!col) return;
  const r=col.getBoundingClientRect(), hpx=r.height/(H1-H0); let min=H0*60+Math.round((pe.clientY-a.dy-r.top)/hpx*4)*15; min=Math.max(H0*60,Math.min(H1*60-15,min));
  if(a.el.parentNode!==col) col.appendChild(a.el); a.el.style.top=((min-H0*60)/60*hpx)+'px'; a.el.style.left='2px'; a.el.style.width='calc(100% - 4px)';
  a.d=col.dataset.d; a.min=min; const eh=a.el.querySelector('.eh'); if(eh) eh.textContent=hm(min)+'–'+hm(min+a.e.dur); }
function evUp(){ window.removeEventListener('pointermove',evMove); const a=ARR; ARR=null; if(!a||!a.mov) return; ARR_FIM=Date.now();
  const e=a.e; if(a.d===e.d&&hm(a.min)===e.h){ render(); return; }
  const tinhaAviso=e.c&&e.lemb&&['aguardando','confirmou','enviado','remarcar'].includes(e.lemb.st);
  e.d=a.d; e.h=hm(a.min); render();
  if(tinhaAviso){ e.lemb.st=null; render(); abrir(()=>shMandar(e.id,'reagendar',`Você mudou pra ${quandoTxt(e.d,e.h)}. ${pn(e.c)} já tinha recebido o horário antigo — avise do novo:`)); }
  else toast('Remarcado: '+nomeEv(e)+' → '+quandoTxt(e.d,e.h)+' · atualizado no Google'); }

/* ════════════ folhas (modal no computador, folha de baixo no celular) ════════════ */
let PILHA=[];
function abrir(fn){ PILHA.push(fn); try{ history.pushState({sh:PILHA.length},''); }catch(_){} pintarSheet(true); }
function trocar(fn){ if(!PILHA.length) return abrir(fn); PILHA[PILHA.length-1]=fn; pintarSheet(true); }
function fechar(){ if(!PILHA.length) return; if(history.state&&history.state.sh) history.back(); else { PILHA.pop(); pintarSheet(); } }
function fecharTudo(){ const n=PILHA.length; if(!n) return; PILHA=[]; pintarSheet(); if(history.state&&history.state.sh){ try{ history.go(-history.state.sh); }catch(_){} } }
addEventListener('popstate',()=>{ const n=(history.state&&history.state.sh)||0; if(PILHA.length>n){ PILHA.length=n; pintarSheet(); render(); } });
addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&PILHA.length){ ev.preventDefault(); fechar(); } });
function repintar(){ if(PILHA.length) pintarSheet(false); }
function pintarSheet(novo){ const sh=$('#sh'), ov=$('#ov');
  if(!PILHA.length){ sh.hidden=true; ov.hidden=true; sh.innerHTML=''; document.body.style.overflow=''; return; }
  const b0=sh.querySelector('.sh-b'), sc=b0&&!novo?b0.scrollTop:0;
  const r=PILHA[PILHA.length-1]();
  sh.innerHTML=`<div class="sh-h"><span class="alca" aria-hidden="true"></span>${PILHA.length>1?`<button class="vol" onclick="fechar()">‹ voltar</button>`:''}<h2 id="sh-tit">${r.tit}</h2><button class="x" onclick="fecharTudo();render()" aria-label="Fechar">✕</button></div>
    <div class="sh-b">${r.corpo}</div>${r.rod?`<div class="sh-f">${r.rod}</div>`:''}`;
  sh.hidden=false; ov.hidden=false; document.body.style.overflow='hidden';
  const b=sh.querySelector('.sh-b'); if(b) b.scrollTop=sc;
  if(novo){ const x=sh.querySelector('.x'); if(x) x.focus({preventScroll:true}); } }
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,3200); }

        aguardando:`Você mandou o pedido de confirmação. ${pn(e.c)} respondeu?`,confirmou:`${pn(e.c)} confirmou. 👍`,remarcar:`${pn(e.c)} pediu pra mudar o horário. Escolha o novo e o CRM prepara a mensagem.`,enviado:'Lembrete enviado. Nada mais a fazer.'}[est]||'';

      `<div class="fld"><span class="fl">Cliente</span>${F.c?`<div class="csel"><b>${esc(P[F.c].nome)}</b><span class="bd et">${esc(P[F.c].et)}</span><button class="btn" onclick="F.c=null;repintar()">trocar</button></div>`:
        `<input id="bcq" type="search" placeholder="Buscar pelo nome…" autocomplete="off" oninput="buscaC(this.value)" aria-label="Buscar cliente"><div id="bcr" class="bcr"></div>`}</div>`}
    <div class="g2"><div class="fld"><label for="fd">Dia</label><input id="fd" type="date" value="${F.d}" onchange="F.d=this.value;repintar()"></div><div class="fld"><label for="fh">Hora</label><input id="fh" type="time" step="900" value="${F.h}" onchange="F.h=this.value;repintar()"></div></div>
    <div class="fld"><span class="fl">Duração</span><div class="pills">${[15,30,45,60,90,120].map(d=>`<button class="pill${F.dur===d?' on':''}" aria-pressed="${F.dur===d}" onclick="F.dur=${d};F.durMexeu=true;repintar()">${durTxt(d)}</button>`).join('')}</div></div>
    ${conf?`<div class="aviso">⚠️ Choca com ${esc(TIPOS[conf.tipo].l)} · ${esc(nomeEv(conf))} (${conf.h}–${hm(m2(conf.h)+conf.dur)}).</div>`:''}
    <div class="fld"><span class="fl">Onde</span><div class="seg f">${[['meet','📹 Google Meet'],['presencial','📍 Presencial'],['tel','📞 Telefone']].map(x=>`<button class="${F.onde===x[0]?'on':''}" aria-pressed="${F.onde===x[0]}" onclick="F.onde='${x[0]}';repintar()">${x[1]}</button>`).join('')}</div>
      ${F.onde==='meet'?'<div class="dica">O link do Meet é criado junto com o evento no Google.</div>':''}
      ${F.onde==='presencial'?`<input id="floc" value="${esc(F.local)}" placeholder="Endereço ou nome do lugar" oninput="F.local=this.value" aria-label="Local"><div class="pills">${['Escritório · Boa Viagem','Casa do cliente','Café perto do cliente'].map(l=>`<button class="pill${F.local===l?' on':''}" onclick="F.local='${l}';repintar()">${l}</button>`).join('')}</div>`:''}</div>
    ${t.google?'':`<div class="box"><h3>🔔 Lembrete pro cliente</h3>
      <div class="seg f">${[['nao','Não lembrar'],['lembrar','Só lembrar'],['confirmar','Pedir confirmação']].map(x=>`<button class="${F.lemb===x[0]?'on':''}" aria-pressed="${F.lemb===x[0]}" onclick="F.lemb='${x[0]}';repintar()">${x[1]}</button>`).join('')}</div>
      ${F.lemb!=='nao'?`<div class="seg f">${[['vespera','Na véspera'],['dia','No dia, de manhã']].map(x=>`<button class="${F.qd===x[0]?'on':''}" aria-pressed="${F.qd===x[0]}" onclick="F.qd='${x[0]}';repintar()">${x[1]}</button>`).join('')}</div>
        <div class="dica">No dia certo ele aparece em <b>📨 lembretes pra mandar</b>. Você toca, o WhatsApp abre com o texto e você aperta enviar. O CRM não manda sozinho.</div>
        ${fake?`<div class="fl">Prévia da mensagem</div><div class="msg">${esc(msgLembrete(fake,F.lemb))}</div>`:'<div class="dica">Escolha o cliente pra ver a prévia.</div>'}`:''}</div>`}`;
  return {tit:F.editId?'✏️ Editar compromisso':'＋ Novo compromisso',corpo,
    rod:`<span class="nota">📆 ${F.editId?'Atualiza':'Vai pro'} seu Google Agenda</span><button class="btn" onclick="fechar()">Cancelar</button><button class="btn p" onclick="fSalvar()">Salvar</button>`}; }
function lembPadrao(tipo){ return TIPOS[tipo].reun?'confirmar':tipo==='entrega'?'lembrar':'nao'; }
function fTipo(k){ const era=F.tipo; F.tipo=k; if(!F.durMexeu) F.dur=TIPOS[k].dur; if(!F.editId) F.lemb=lembPadrao(k); if(k==='ligar') F.onde='tel'; else if(era==='ligar'&&F.onde==='tel') F.onde='meet'; repintar(); }
function buscaC(q){ const r=$('#bcr'); if(!r) return; const n=norm(q).trim(); if(!n){ r.innerHTML=''; return; }
  const l=Object.keys(P).filter(k=>norm(P[k].nome).includes(n)).slice(0,6);
  r.innerHTML=l.map(k=>`<button onclick="F.c='${k}';repintar()"><b>${esc(P[k].nome)}</b><span class="bd et">${esc(P[k].et)}</span></button>`).join('')+`<button onclick="toast('No app: abre o cadastro rápido de contato novo, já com esse nome.')">＋ Cadastrar “${esc(q)}” como contato novo</button>`; }
function fSalvar(){ const t=TIPOS[F.tipo];
  if(!t.google&&!F.c){ toast('Escolha o cliente (ou use o tipo "Outro (sem cliente)")'); const i=$('#bcq'); if(i) i.focus(); return; }
  if(t.google&&!String(F.tit).trim()){ toast('Diga o que é o compromisso'); return; }
  if(!F.d||!F.h){ toast('Escolha dia e hora'); return; }
  const lemb=!t.google&&F.lemb!=='nao'?{modo:F.lemb,qd:F.qd,st:null}:null;
  let e;
  if(F.editId){ e=EV.find(x=>x.id===F.editId); const mudouHora=e.d!==F.d||e.h!==F.h; Object.assign(e,{tipo:F.tipo,c:t.google?null:F.c,tit:F.tit,d:F.d,h:F.h,dur:F.dur,onde:F.onde,local:F.local});
    if(!lemb) e.lemb=null; else if(!e.lemb||mudouHora||e.lemb.modo!==lemb.modo||e.lemb.qd!==lemb.qd) e.lemb=Object.assign(lemb,{st:e.lemb&&!mudouHora&&e.lemb.modo===lemb.modo?e.lemb.st:null}); }
  else { e=E(F.d,F.h,F.tipo,t.google?null:F.c,{tit:F.tit,dur:F.dur,onde:F.onde,local:F.local,lemb}); EV.push(e); }
  toast((F.editId?'Atualizado: ':'Marcado: ')+t.l+' · '+nomeEv(e)+' — '+quandoTxt(e.d,e.h)+' · no seu Google Agenda'+(lemb?' · lembrete '+(lemb.qd==='vespera'?'na véspera':'no dia'):''));
  F={}; if(ST.modo!=='lista') ST.cur=e.d; fecharTudo(); render(); }

/* ── listas dos alertas ── */
function shFinLista(){ const l=EV.filter(aFinalizar);
  return {tit:'🤝 Reuniões a finalizar',corpo:`<div class="dica">A data passou e ninguém disse o que houve. Finalizar gera o próximo passo — o funil anda.</div>`+(l.map(e=>`<div class="srow"><div class="t"><b>${esc(nomeEv(e))}</b><span class="mut">${TIPOS[e.tipo].l} · ${quandoTxt(e.d,e.h)} · ${entre(e.d,HOJE)}d sem desfecho</span></div><button class="btn p" onclick="abrir(()=>shFinalizar('${e.id}'))">Finalizar</button></div>`).join('')||'<div class="vazio">Nada a finalizar. 🎉</div>')}; }
function shLembretes(){ const ph=lembsHoje(), aw=lembsAguard();
  const lin=(e,bt)=>`<div class="srow"><div class="t"><b>${esc(nomeEv(e))}</b><span class="mut">${TIPOS[e.tipo].l} · ${quandoTxt(e.d,e.h)} · ${e.lemb.modo==='confirmar'?'pedir confirmação':'só lembrar'}</span></div>${bt}</div>`;
  return {tit:'📨 Lembretes pro cliente',corpo:`<div class="dica">O CRM deixa a mensagem pronta no dia certo. Você toca, o WhatsApp abre com o texto e você aperta enviar.</div>
    <div class="sec-t">Pra mandar hoje · ${ph.length}</div><div>${ph.map(e=>lin(e,`<button class="btn v" onclick="abrir(()=>shMandar('${e.id}','lembrete'))">💬 Mandar</button>`)).join('')||'<div class="vazio">Nenhum pra hoje.</div>'}</div>
    <div class="sec-t">Esperando resposta · ${aw.length}</div><div>${aw.map(e=>lin(e,lembEstado(e)==='remarcar'?`${chipLemb(e)}<button class="btn p" onclick="abrir(()=>shReagendar('${e.id}'))">🔁 Reagendar</button>`:`<button class="btn" onclick="lembResp('${e.id}','confirmou')">✅ Confirmou</button><button class="btn" onclick="lembResp('${e.id}','remarcar')">🔁 Remarcar</button>`)).join('')||'<div class="vazio">Ninguém pendente.</div>'}</div>`}; }
function shSemProx(){ return {tit:'💤 Sem próxima atividade',corpo:`<div class="dica">Negócio aberto sem nada marcado é negócio parado. Marque o próximo passo.</div>`+SEM_PROX.map(k=>`<div class="srow"><div class="t"><b>${esc(P[k].nome)}</b><span class="mut">etapa ${esc(P[k].et)}</span></div><button class="btn p" onclick="abrir(()=>shNovo({c:'${k}',d:'${add(HOJE,1)}',h:'10:00',tipo:'ligar',banner:'Próxima atividade de ${esc(pn(k))}'}))">＋ próxima</button></div>`).join('')}; }
function shAniv(){ return {tit:'🎂 Aniversariantes da semana',corpo:ANIV.map(a=>`<div class="srow"><div class="t"><b>${esc(P[a.c].nome)}</b><span class="mut">${quandoTxt(a.d)} · ${br(a.d)}</span></div><button class="btn v" onclick="abrir(()=>shMandarTxt('${a.c}','Feliz aniversário, ${esc(pn(a.c))}! 🎉 Muita saúde e um ano incrível. — Gustavo'))">💬 parabéns</button></div>`).join('')}; }
function shDiaTudo(d){ const ts=TAR.filter(t=>t.st!=='concluida'&&t.venc===d), an=ANIV.filter(a=>a.d===d);
  return {tit:`☑️ ${DSL[dow(d)]}, ${br(d)}`,corpo:(an.length?`<div class="sec-t">Aniversário</div>${an.map(a=>`<div class="srow"><div class="t"><b>🎂 ${esc(P[a.c].nome)}</b></div><button class="btn v" onclick="abrir(()=>shMandarTxt('${a.c}','Feliz aniversário, ${esc(pn(a.c))}! 🎉 Muita saúde e um ano incrível. — Gustavo'))">💬 parabéns</button></div>`).join('')}`:'')+
    `<div class="sec-t">Tarefas que vencem · ${ts.length}</div><div>${ts.map(tarMini).join('')||'<div class="vazio">Nenhuma.</div>'}</div>`,rod:`<button class="btn p" onclick="abrir(()=>shTarefa(null,{venc:'${d}'}))">＋ tarefa neste dia</button>`}; }

/* ── tarefa ── */
let TF={};
function shTarefa(id,pre){ const chave=(id||'novo')+JSON.stringify(pre||{});
  if(TF._k!==chave){ const t=id?TAR.find(x=>x.id===id):null; TF=t?{_k:chave,id,tit:t.tit,c:t.c,venc:t.venc,prio:t.prio,st:t.st,resp:t.resp,ck:t.ck.map(x=>({...x})),novoCk:''}:{_k:chave,id:null,tit:'',c:null,venc:(pre&&pre.venc)||HOJE,prio:'media',st:'pendente',resp:'eu',ck:[],novoCk:''}; }
  const corpo=`<div class="fld"><label for="ttit">Tarefa</label><input id="ttit" value="${esc(TF.tit)}" placeholder="Ex.: Enviar proposta revisada" oninput="TF.tit=this.value"></div>
    <div class="fld"><span class="fl">Ligada a (opcional)</span>${TF.c?`<div class="csel"><b>${esc(P[TF.c].nome)}</b><span class="bd et">${esc(P[TF.c].et)}</span><button class="btn" onclick="ficha('${TF.c}')">ficha</button><button class="btn" onclick="TF.c=null;repintar()">trocar</button></div>`:
      `<input id="tbq" type="search" placeholder="Buscar lead ou cliente…" autocomplete="off" oninput="buscaT(this.value)" aria-label="Buscar lead ou cliente"><div id="tbr" class="bcr"></div>`}</div>
    <div class="g2"><div class="fld"><label for="tven">Vencimento</label><input id="tven" type="date" value="${TF.venc}" onchange="TF.venc=this.value"></div>
      <div class="fld"><span class="fl">Responsável</span><div class="seg f">${[['eu','Eu'],['victor','Victor']].map(x=>`<button class="${TF.resp===x[0]?'on':''}" aria-pressed="${TF.resp===x[0]}" onclick="TF.resp='${x[0]}';repintar()">${x[1]}</button>`).join('')}</div></div></div>
    <div class="fld"><span class="fl">Prioridade</span><div class="seg f">${Object.keys(PRIO).map(k=>`<button class="${TF.prio===k?'on':''}" aria-pressed="${TF.prio===k}" onclick="TF.prio='${k}';repintar()">${PRIO[k][0]}</button>`).join('')}</div></div>
    <div class="fld"><span class="fl">Situação</span><div class="seg f">${TST.map(s=>`<button class="${TF.st===s[0]?'on':''}" aria-pressed="${TF.st===s[0]}" onclick="TF.st='${s[0]}';repintar()">${s[1]}</button>`).join('')}</div></div>
    <div class="box"><h3>☑ Checklist <span class="mut">${TF.ck.filter(x=>x.ok).length}/${TF.ck.length}</span></h3>
      ${TF.ck.map((x,i)=>`<div class="ckle"><button class="cki${x.ok?' ok':''}" style="flex:1" role="checkbox" aria-checked="${x.ok}" onclick="TF.ck[${i}].ok=!TF.ck[${i}].ok;repintar()"><span class="bx">${x.ok?'✓':''}</span><span>${esc(x.t)}</span></button><button class="btn ico" aria-label="Tirar item" onclick="TF.ck.splice(${i},1);repintar()">✕</button></div>`).join('')}
      <div class="ckle"><input id="tck" value="${esc(TF.novoCk)}" placeholder="Novo item (curto)" oninput="TF.novoCk=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();ckAdd()}" aria-label="Novo item do checklist"><button class="btn" onclick="ckAdd()">＋</button></div></div>`;
  return {tit:TF.id?'✏️ Tarefa':'＋ Nova tarefa',corpo,rod:`${TF.id?`<button class="btn perigo" onclick="tarExcluir()">Excluir</button>`:''}<span class="sp"></span><button class="btn" onclick="fechar()">Cancelar</button><button class="btn p" onclick="tarSalvar()">Salvar</button>`}; }
function buscaT(q){ const r=$('#tbr'); if(!r) return; const n=norm(q).trim(); if(!n){ r.innerHTML=''; return; }
  r.innerHTML=Object.keys(P).filter(k=>norm(P[k].nome).includes(n)).slice(0,6).map(k=>`<button onclick="TF.c='${k}';repintar()"><b>${esc(P[k].nome)}</b><span class="bd et">${esc(P[k].et)}</span></button>`).join('')||'<button disabled>Ninguém com esse nome</button>'; }
function ckAdd(){ const v=String(TF.novoCk||'').trim(); if(!v) return; TF.ck.push({t:v,ok:false}); TF.novoCk=''; repintar(); const i=$('#tck'); if(i) i.focus(); }
function tarSalvar(){ if(!String(TF.tit).trim()){ toast('Dê um nome à tarefa'); const i=$('#ttit'); if(i) i.focus(); return; }
  const dados={tit:TF.tit.trim(),c:TF.c,venc:TF.venc,prio:TF.prio,st:TF.st,resp:TF.resp,ck:TF.ck};
  if(TF.id) Object.assign(TAR.find(x=>x.id===TF.id),dados); else TAR.push(Object.assign({id:uid()},dados));
  toast((TF.id?'Tarefa atualizada: ':'Tarefa criada: ')+dados.tit+(dados.resp==='victor'?' · com o Victor':'')); TF={}; fecharTudo(); render(); }
function tarExcluir(){ TAR=TAR.filter(x=>x.id!==TF.id); toast('Tarefa excluída'); TF={}; fecharTudo(); render(); }
function shMover(id){ const t=TAR.find(x=>x.id===id);
  return {tit:'Mover · '+esc(t.tit),corpo:TST.map(([k,l,cor])=>`<button class="opt" ${t.st===k?'disabled style="opacity:.5"':''} onclick="tarMover('${id}','${k}');fechar();render()"><span class="oi" style="color:${cor}">●</span><span><b>${l}</b>${t.st===k?'<span class="dica">está aqui agora</span>':''}</span></button>`).join('')}; }

/* re-pinta ao cruzar o limite celular/computador */
let ERA_M=M(); addEventListener('resize',()=>{ if(M()!==ERA_M){ ERA_M=M(); render(); repintar(); } });
render();
</script>
</body>
</html>
