<title>Ficha UX 2.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a gaveta da ficha do CRM Visão LP (mesmo visual do app), redesenhada — cabeçalho só com identidade, uma barra de 4 ações iguais,
   um quadro "Agora" (etapa · status · último contato · próximo passo) e os tópicos agrupados em Negócio / Pessoa / Histórico. Tema claro único, como o app. */
:root{
  color-scheme:light;
  --primary:#2563eb; --primary-2:#1d4ed8; --navy:#0f172a; --navy-2:#1e293b; --azul-claro:#eff6ff; --azul-borda:#bfdbfe;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --linha:#e2e8f0; --linha2:#cbd5e1; --fundo:#f1f5f9; --card:#ffffff;
  --verde:#16a34a; --verde-bg:#dcfce7; --amarelo:#b45309; --amarelo-bg:#fef3c7; --verm:#dc2626; --verm-bg:#fee2e2; --laranja:#c2410c; --laranja-bg:#fff7ed;
  --head-ink:#f8fafc; --head-mut:#cbd5e1; --head-chip:#1e293b; --estrela:#f59e0b; --estrela-off:#475569;
  --sombra:rgba(15,23,42,.42);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--fundo);color:var(--ink);font-family:var(--font);font-size:14px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* barra da demo */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--head-mut);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.demo b{color:var(--head-ink)}
.demo .sp{flex:1}
.seg{display:inline-flex;border:1px solid #334155;border-radius:10px;overflow:hidden}
.seg button{padding:8px 12px;min-height:40px;color:var(--head-mut);background:var(--navy-2)}
.seg button.on{background:var(--primary);color:#fff;font-weight:600}
.demo .nota{width:100%;font-size:12px;color:var(--head-mut)}

/* fundo: o quadro do funil, esmaecido */
.palco{position:relative;min-height:calc(100% - 60px);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.quadro{display:flex;gap:12px;opacity:.55;filter:saturate(.7);pointer-events:none}
.col{flex:0 0 250px;background:#e9eef4;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px}
.col h4{margin:4px;font-size:13px}
.cardf{background:var(--card);border:1px solid var(--linha);border-radius:10px;height:92px}
.ov{position:fixed;inset:0;background:var(--sombra);z-index:20}

/* ═════ a gaveta ═════ */
.drw{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);z-index:30;background:var(--fundo);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(15,23,42,.2)}
.dh{background:var(--navy);color:var(--head-ink);padding:max(14px,env(safe-area-inset-top,0px)) 16px 12px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.dh .l1{display:flex;align-items:flex-start;gap:10px}
.dh h2{margin:0;font-size:19px;line-height:1.25;flex:1;min-width:0;text-wrap:balance}
.x{width:44px;height:44px;border-radius:50%;background:var(--navy-2);color:var(--head-ink);font-size:20px;flex:0 0 auto;margin:-6px -4px 0 0}
.quem{font-size:13px;color:var(--head-mut)}
.l3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stars{display:inline-flex;gap:1px;font-size:16px;letter-spacing:0}.stars span{color:var(--estrela-off)}.stars span.on{color:var(--estrela)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--head-chip);color:var(--head-ink);border:1px solid #334155;white-space:nowrap}
.chip.et{background:var(--primary);border-color:var(--primary)}
.chip.ok{background:#14532d;border-color:#166534;color:#dcfce7}
.rec{font-size:12.5px;color:var(--head-mut)}.rec b{color:var(--head-ink);font-weight:600}.rec .cli{color:#86efac;font-weight:600}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.acoes button{min-height:34px;padding:0 12px;border-radius:999px;background:var(--navy-2);color:var(--head-ink);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;border:1px solid #334155;white-space:nowrap}
.acoes button.p{background:var(--primary);border-color:var(--primary);color:#fff}
.acoes button:hover{background:#273449}.acoes button.p:hover{background:var(--primary-2)}

.tabs{display:flex;align-items:center;gap:2px;background:var(--card);border-bottom:1px solid var(--linha);padding:0 8px;flex:0 0 auto;overflow-x:auto}
.tabs .t{padding:0 14px;min-height:46px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs .t.on{color:var(--primary-2);border-bottom-color:var(--primary)}
.tabs .t .n{font-weight:500;font-size:12px;color:var(--muted);margin-left:3px}
.tabs .sp{flex:1}
.mini{min-height:34px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--ink2);border:1px solid var(--linha);background:var(--card);white-space:nowrap}
.dobras-acts{display:flex;gap:6px;align-items:center;padding:8px 0}
.dobras-acts.b{justify-content:flex-end;padding:0}
.so-m{display:none!important}

.db{flex:1;overflow:auto;padding:12px 14px max(30px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.grupo{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:8px 2px 0;display:flex;align-items:center;gap:8px}
.grupo::after{content:"";flex:1;height:1px;background:var(--linha2)}

/* quadro Agora */
.agora{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.agora .tit{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.agora .tit select{border:0;background:transparent;color:var(--primary-2);font-weight:600;font-size:12.5px;max-width:220px}
.trilha{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.trilha::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;min-height:38px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:600;background:var(--fundo);color:var(--ink2);border:1px solid var(--linha);display:inline-flex;align-items:center;gap:5px}
.st.feita{background:var(--azul-claro);color:var(--primary-2);border-color:var(--azul-borda)}
.st.atual{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 8px rgba(37,99,235,.35)}
.st.enc{color:var(--verm);background:var(--card);border-style:dashed}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.lb{font-size:11.5px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--linha);border-radius:8px;padding:7px 9px;min-height:40px;background:var(--card);width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.val{min-height:40px;display:flex;align-items:center;gap:6px;font-size:13.5px;flex-wrap:wrap}
.tar{display:inline-flex;align-items:center;gap:6px;background:var(--azul-claro);color:var(--primary-2);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
.aviso{background:var(--laranja-bg);color:var(--laranja);border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px}
.lk{color:var(--primary-2);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;min-height:32px;padding:0 2px}

/* tópicos dobráveis */
details.tp{background:var(--card);border:1px solid var(--linha);border-radius:12px}
details.tp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px}
details.tp>summary::-webkit-details-marker{display:none}
details.tp>summary .ic{width:22px;text-align:center;flex:0 0 auto}
details.tp>summary .nm{font-weight:650;font-size:14px}
details.tp>summary .rs{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
details.tp>summary .rs.al{color:var(--laranja);font-weight:600}
details.tp>summary::after{content:"▸";color:var(--muted);font-size:12px;flex:0 0 auto}
details.tp[open]>summary::after{content:"▾"}
details.tp[open]>summary{border-bottom:1px solid var(--linha)}
.tb{padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.lin{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--linha)}
.lin:last-child{border-bottom:0}
.sn{display:inline-flex;border:1px solid var(--linha);border-radius:8px;overflow:hidden}.sn button{min-height:36px;padding:0 12px;font-size:13px}.sn button.on{background:var(--primary);color:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--linha);background:var(--card);font-size:12.5px;color:var(--ink2)}
.pill.on{background:var(--azul-claro);border-color:var(--azul-borda);color:var(--primary-2);font-weight:600}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--linha);font-size:13px}
.hist small{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.reg{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.reg .fld{flex:1 1 200px}
.btn{min-height:40px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13.5px;border:1px solid var(--linha);background:var(--card);color:var(--ink)}
.btn.p{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.perigo{color:var(--verm);border-color:#fecaca}
.mut{color:var(--muted);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tiles div{background:var(--fundo);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:2px}.tiles span{font-size:11.5px;color:var(--muted)}.tiles b{font-variant-numeric:tabular-nums}

/* menu ⋯ e toast */
.menu{position:fixed;z-index:50;background:var(--card);border:1px solid var(--linha);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.2);padding:6px;min-width:240px;display:flex;flex-direction:column}
.menu .mh{font-size:11.5px;color:var(--muted);font-weight:700;padding:6px 10px;letter-spacing:.04em;text-transform:uppercase}
.menu button{text-align:left;padding:0 10px;min-height:42px;border-radius:8px;font-size:13.5px}.menu button:hover{background:var(--fundo)}
.menu button.perigo{color:var(--verm)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}

.cmp{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;max-width:min(560px,calc(100vw - 640px));background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 8px 24px rgba(15,23,42,.12)}
.cmp h3{margin:0 0 6px;font-size:14px}
.cmp ul{margin:0;padding-left:18px}

@media (max-width:760px){
  .drw{width:100%;top:0}
  .quadro{display:none}.cmp{display:none}
  .acoes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.acoes button{min-height:44px;padding:0 4px;justify-content:center;font-size:12px;gap:4px}
  .tabs .dobras-acts{display:none}.so-m{display:flex!important}
  .fld input,.fld select,.fld textarea,.agora .tit select{font-size:16px;min-height:44px}
  .g2{grid-template-columns:1fr}
  .st,.mini,.sn button,.pill,.lk,.btn{min-height:44px}
  .tiles{grid-template-columns:1fr 1fr}
  details.tp>summary .rs{max-width:48%}
}
</style>

<div class="demo">
  <b>Ficha · UX 2.0</b>
  <span class="seg" role="group" aria-label="Versão"><button type="button" id="vA" class="on" onclick="versao('A')">A · abas (como o Global)</button><button type="button" id="vB" onclick="versao('B')">B · rolagem única</button></span>
  <span class="sp"></span>
  <span class="nota">Dados inventados. Toque nos tópicos, nas abas, em ⋯ Mais e na trilha de etapas.</span>
</div>

<div class="palco">
  <div class="quadro" aria-hidden="true">
    <div class="col"><h4>Novo</h4><div class="cardf"></div><div class="cardf"></div></div>
    <div class="col"><h4>OI</h4><div class="cardf"></div></div>
    <div class="col"><h4>PC</h4><div class="cardf"></div><div class="cardf"></div></div>
    <div class="col"><h4>C2</h4><div class="cardf"></div></div>
  </div>
  <aside class="cmp" id="cmp"></aside>
</div>
<div class="ov" aria-hidden="true"></div>

<section class="drw" id="drw" role="dialog" aria-label="Ficha do negócio"></section>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const C={nome:'Marcos Exemplo Lima',prof:'Dentista',idade:41,cidade:'Recife',civil:'Casado',filhos:2,tel:'(81) 90000-3180',email:'marcos@exemplo.com',
  rec:'Paula Exemplo',recCli:true,ance:{a:true,n:true,c:true,e:true,avisado:true},etapa:'c2',status:'Em andamento',pm:600,prob:60};
const TRILHA=[['novo','Novo'],['oi','OI'],['revisita','Revisita'],['pc','PC'],['c2','C2'],['n','N'],['fa','FA'],['emitida','Apólice emitida'],['entrega','Entrega']];
const ENC=[['nao','Não'],['prop_cancelada','Prop. cancelada'],['apol_cancelada','Apól. cancelada']];
let V='A', TAB='neg'; const ABERTO={};
const ANCE=[['a','A — Acessível'],['n','N — Necessidade'],['c','C — Capacidade financeira'],['e','E — Elegibilidade (saúde)'],['avisado','Avisado pelo recomendante']];
const HIST=[['Ligação atendida','22/10','lig'],['Agendou C2','22/10','reu'],['WhatsApp enviado','20/10','wa'],['Reunião PC realizada','18/10','reu'],['Etapa: OI → PC','18/10','etapa'],['Nota: quer proteção pra renda da clínica','15/10','nota'],['Agendou OI/FF','10/10','reu'],['Ligação não atendida','09/10','lig']];
let HF='tudo';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2400); }
function anceN(){ return Object.values(C.ance).filter(Boolean).length; }

function tp(k,ic,nm,rs,corpo,al){ return `<details class="tp" data-k="${k}" ${ABERTO[k]?'open':''} ontoggle="ABERTO['${k}']=this.open"><summary><span class="ic">${ic}</span><span class="nm">${nm}</span><span class="rs${al?' al':''}">${rs}</span></summary><div class="tb">${corpo}</div></details>`; }
function sn(k,v){ return `<span class="sn"><button type="button" class="${v?'on':''}" onclick="toast('Gravado')">Sim</button><button type="button" class="${v?'':'on'}" onclick="toast('Gravado')">Não</button></span>`; }

function header(){ let st=''; for(let i=1;i<=5;i++) st+=`<span class="${i<=anceN()?'on':''}">★</span>`;
  const et=TRILHA.find(x=>x[0]===C.etapa)[1];
  return `<header class="dh"><div class="l1"><h2>${esc(C.nome)}</h2><button type="button" class="x" aria-label="Fechar ficha" onclick="toast('Fecha e volta pro funil')">✕</button></div>
   <div class="quem">${esc(C.prof)} · ${C.idade} anos · ${esc(C.cidade)} · ${esc(C.tel)}</div>
   <div class="l3"><span class="stars" title="ANCE ${anceN()}/5">${st}</span><span class="chip et">● ${esc(et)}</span><span class="chip">${esc(C.status)}</span><span class="chip">🔥 quente</span></div>
   <div class="rec">🙌 Recomendado por <b>${esc(C.rec)}</b>${C.recCli?' · <span class="cli">cliente</span>':''}</div>
   <div class="acoes"><button type="button" class="p" onclick="menu(event,'zap')">💬 WhatsApp</button><button type="button" onclick="menu(event,'lig')">☏ Ligar</button><button type="button" onclick="toast('Abre dia, hora e lembrete → vira reunião na Agenda')">📅 Agendar</button><button type="button" onclick="menu(event,'mais')">⋯ Mais</button></div></header>`; }

function agora(){ const i=TRILHA.findIndex(x=>x[0]===C.etapa), et=TRILHA[i][1];
  return tp('funil','🎯','Funil e etapa',`● ${esc(et)} · ${esc(C.status)} · próx. 28/10`,
   `<div class="tit" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="lb">ETAPA</span><select id="funil" aria-label="Funil" style="border:0;background:transparent;color:var(--primary-2);font-weight:600"><option>Funil: Vida Individual</option><option>Funil: MFO</option></select></div>
   <div class="trilha" role="group" aria-label="Etapas">${TRILHA.map(([k,l],j)=>`<button type="button" class="st ${j<i?'feita':j===i?'atual':''}" onclick="mover('${k}')">${j<i?'✓ ':''}${esc(l)}</button>`).join('')}<button type="button" class="st enc" onclick="menu(event,'enc')">✖ Encerrar…</button></div>
   <div class="g2"><div class="fld"><label for="st">Status nesta etapa</label><select id="st"><option>Em andamento</option><option>Aguardando cliente</option><option>Não atendeu</option></select></div>
     <div class="fld"><span class="lb">Próximo passo</span><div class="val"><span class="tar">📅 Reunião C2 · 28/10 14:00</span></div></div></div>
   <div class="mut">Último contato: Ligação atendida · 22/10 · 3 dias na etapa</div>`); }
/* trilha abre centralizada na etapa atual */
document.addEventListener('toggle',e=>{ const d=e.target; if(!d.open||!d.querySelector) return; const at=d.querySelector('.st.atual'); if(at){ const tr=at.parentElement; tr.scrollLeft=Math.max(0,at.offsetLeft-tr.offsetLeft-tr.clientWidth/2+at.offsetWidth/2); } },true);

const T={
 valor:()=>tp('valor','💰','Valor do negócio',`R$ ${C.pm}/mês · PA R$ 7.200 · ${C.prob}%`,
   `<div class="g2"><div class="fld"><label for="vt">O que se vende</label><input id="vt" value="Vida e Saúde 20 anos · 800 mil"></div><div class="fld"><label for="vp">Prêmio mensal (R$)</label><input id="vp" inputmode="decimal" value="600"></div>
    <div class="fld"><label for="vf">Previsão de fechamento</label><input id="vf" type="date" value="2026-11-05"></div><div class="fld"><label for="ve">Previsão de emissão</label><input id="ve" type="date" value="2026-11-20"></div>
    <div class="fld"><label for="vpb">Probabilidade</label><select id="vpb"><option>Pela etapa (60%)</option><option>80%</option><option>40%</option></select></div><div class="fld"><label for="vin">No funil desde</label><input id="vin" type="date" value="2026-10-10"></div></div>
    <div class="tiles"><div><span>PA</span><b>R$ 7.200</b></div><div><span>PA ponderado</span><b>R$ 4.320</b></div><div><span>Seu funil (C2)</span><b>55%</b></div></div>`),
 tarefas:()=>tp('tarefas','✅','Tarefas e atividades','1 aberta · 28/10',
   `<div class="lin"><span>🤝 Reunião C2</span><span class="mut">28/10 14:00</span></div><div class="lin"><span class="mut">✓ Enviar simulação · feita 20/10</span></div>
    <div class="g2"><div class="fld"><label for="tn">Nova tarefa</label><input id="tn" placeholder="ex.: mandar proposta"></div><div class="fld"><label for="td">Quando</label><input id="td" type="date" value="2026-10-29"></div></div><button type="button" class="btn" onclick="toast('Tarefa criada')">＋ Criar tarefa</button>`),
 sim:()=>tp('sim','📄','Simulações e propostas','2 · 1 ativada',
   `<div class="lin"><span>📄 Vida Inteira 800 mil</span><span class="chip ok" style="font-size:11px">Ativada</span></div><div class="lin"><span>📄 Temporário 20 anos</span><span class="mut">Apresentado</span></div><button type="button" class="btn" onclick="toast('Abre a simulação nova')">＋ Simulação</button>`),
 sitplan:()=>tp('sitplan','📋','SitPlan e lista de discagem','fora da lista',
   `<div class="pills"><button type="button" class="pill" onclick="toast('No SitPlan de hoje')">Hoje</button><button type="button" class="pill" onclick="toast('Próx. terça')">Próx. terça</button><button type="button" class="pill" onclick="toast('Próx. sexta')">Próx. sexta</button></div><div class="fld"><label for="lta">Lista de TA</label><select id="lta"><option>— nenhuma —</option><option>Dentistas Recife</option></select></div>`),
 solic:()=>tp('solic','📨','Solicitações','nenhuma',`<div class="mut">Pedidos ao backoffice ligados a este negócio aparecem aqui.</div><button type="button" class="btn" onclick="toast('Nova solicitação')">＋ Solicitação</button>`),
 drive:()=>tp('drive','📁','Arquivos no Drive','3 arquivos',`<div class="lin"><span>📎 Simulação VI 800mil.pdf</span><span class="mut">20/10</span></div><div class="lin"><span>📎 Fact-find.pdf</span><span class="mut">18/10</span></div><div class="mut">Arraste arquivos aqui pra guardar na pasta do cliente.</div>`),
 quem:()=>tp('quem','👤','Quem é a pessoa',`${C.prof} · ${C.idade} · ${C.civil.toLowerCase()} · ${C.filhos} filhos`,
   `<div class="g2"><div class="fld"><label for="pn">Nome</label><input id="pn" value="${esc(C.nome)}"></div><div class="fld"><label for="pap">Apelido (vai nas mensagens)</label><input id="pap" value="Marcos"></div>
    <div class="fld"><label for="pt">Celular</label><input id="pt" value="${esc(C.tel)}"></div><div class="fld"><label for="pe">E-mail</label><input id="pe" value="${esc(C.email)}"></div>
    <div class="fld"><label for="pp">Profissão</label><input id="pp" value="${esc(C.prof)}"></div><div class="fld"><label for="pnas">Nascimento</label><input id="pnas" type="date" value="1985-03-12"></div>
    <div class="fld"><label for="pc">Cidade</label><input id="pc" value="${esc(C.cidade)}"></div><div class="fld"><label for="po">Origem</label><select id="po"><option>Recomendação</option><option>Lead</option><option>Carteira</option></select></div></div>
    <div class="mut">Vale para as 2 oportunidades desta pessoa.</div>`),
 ance:()=>tp('ance','⭐','Qualificação (ANCE)',`${anceN()}/5 · 🔥 quente · Mercado X`,
   `${ANCE.map(([k,l])=>`<div class="lin"><span>${l}</span>${sn(k,C.ance[k])}</div>`).join('')}
    <div class="g2"><div class="fld"><label for="qm">Mercado</label><select id="qm"><option>Mercado X</option><option>Mercado Y</option><option>Mercado Z</option></select></div><div class="fld"><label for="qt">Temperatura</label><select id="qt"><option>🔥 Quente</option><option>Morno</option><option>Frio</option></select></div></div>`),
 rec:()=>tp('rec','🙌','Recomendação',`de ${C.rec} (cliente) · sem data`,
   `<div class="g2"><div class="fld"><label for="rr">Recomendado por</label><input id="rr" value="${esc(C.rec)}"></div><div class="fld"><label for="rd">Recebida em</label><input id="rd" type="date"></div></div>
    <div class="lin"><span>Recomendações que ele já deu</span><b>0</b></div><button type="button" class="btn" onclick="toast('Adicionar recomendação')">＋ Recomendação dele</button>`,true),
 info:()=>tp('info','🧾','InfoClient (fact-find)','50% preenchido',
   `<div class="pills">${['Dados pessoais ✓','Estrutura familiar ✓','Dados financeiros','Saúde e estilo de vida'].map((x,i)=>`<button type="button" class="pill ${i<2?'on':''}" onclick="toast('Abre o bloco do InfoClient')">${x}</button>`).join('')}</div>
    <div class="tiles"><div><span>Renda mensal</span><b>R$ 25 mil</b></div><div><span>Despesa família</span><b>—</b></div><div><span>Patrimônio</span><b>—</b></div></div>`),
 cart:()=>tp('cart','🛡','Carteira','ainda não é cliente',`<div class="mut">Quando a apólice emitir, ela aparece aqui com pagamento e coberturas.</div>`),
 notas:()=>tp('notas','📝','Notas','1 nota',`<div class="fld"><label for="nt">Notas</label><textarea id="nt">Quer proteção pra renda da clínica. Esposa também dentista.</textarea></div>`),
 conv:()=>tp('conv','💬','Conversas do WhatsApp','2 resumos',`<div class="lin"><span>Resumo 20/10: pediu valores pra 800 mil</span><span class="mut">IA</span></div>`)};

function histBloco(){ const l=HIST.filter(h=>HF==='tudo'||h[2]===HF);
  return `<section class="reg"><div class="fld"><label for="rres">Registrar contato</label><select id="rres"><option>Ligação atendida</option><option>Ligação não atendida</option><option>WhatsApp enviado</option><option>Agendou C2</option><option>Sem interesse</option></select></div><button type="button" class="btn p" onclick="toast('Registrado: conta no SitPlan e nos KPIs')">Registrar</button></section>
   <section class="agora"><div class="tit"><span>JORNADA · ${HIST.length}</span></div><div class="pills">${[['tudo','Tudo'],['lig','Ligações'],['wa','WhatsApp'],['reu','Reuniões'],['nota','Notas']].map(([k,t])=>`<button type="button" class="pill ${HF===k?'on':''}" onclick="HF='${k}';pinta()">${t}</button>`).join('')}</div>
   <div class="hist">${l.map(h=>`<div><span>${esc(h[0])}</span><small>${h[1]}</small></div>`).join('')||'<div class="mut">Nada nesse filtro.</div>'}</div></section>`; }

const GRUPOS={neg:['Negócio',['tarefas','valor','sim','sitplan','solic','drive']],pes:['Pessoa',['quem','ance','rec','info','cart']],his:['Histórico',['notas','conv']]};
function acts(){ return `<button type="button" class="mini" onclick="todas(true)">▾ Abrir tudo</button><button type="button" class="mini" onclick="todas(false)">▸ Recolher tudo</button>`; }

function corpoA(){ const g=GRUPOS[TAB];
  return (TAB==='neg'?agora():'')+(TAB==='his'?histBloco():'')+g[1].map(k=>T[k]()).join(''); }
function corpoB(){ return agora()+Object.entries(GRUPOS).map(([k,[n,ks]])=>`<div class="grupo">${n}</div>`+(k==='his'?histBloco():'')+ks.map(x=>T[x]()).join('')).join(''); }

function pinta(){ const d=$('#drw'), sc=(d.querySelector('.db')||{}).scrollTop||0;
  d.innerHTML=header()+(V==='A'?`<nav class="tabs" role="tablist">${[['neg','Negócio',''],['pes','Pessoa',''],['his','Histórico',HIST.length]].map(([k,t,n])=>`<button type="button" role="tab" aria-selected="${TAB===k}" class="t ${TAB===k?'on':''}" onclick="TAB='${k}';pinta();document.querySelector('.db').scrollTop=0">${t}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</nav>`:'')+
    `<div class="db">${V==='A'?corpoA():corpoB()}</div>`;
  d.querySelector('.db').scrollTop=sc; cmp(); const at=d.querySelector('.st.atual'); if(at){ const tr=at.parentElement; tr.scrollLeft=Math.max(0,at.offsetLeft-tr.clientWidth/2+at.offsetWidth/2); } }
function cmp(){ $('#cmp').innerHTML=V==='A'?`<h3>A · abas (como o Global)</h3><ul><li>3 abas: <b>Negócio</b> (funil e etapa, tarefas, valor, simulações…), <b>Pessoa</b> (quem é, ANCE, recomendação, InfoClient, carteira), <b>Histórico</b> (registrar + jornada + notas).</li><li>Cada aba é curta: acha rápido sem rolar.</li><li>Custa 1 toque pra trocar de aba.</li></ul>`
  :`<h3>B · rolagem única</h3><ul><li>Tudo numa coluna, em 3 grupos com título: Negócio, Pessoa, Histórico.</li><li>Tópicos fechados com o resumo no cabeçalho: dá pra ler a ficha inteira sem abrir nada.</li><li>Sem troca de aba, mas a lista é mais longa.</li></ul>`; }
function versao(v){ V=v; $('#vA').classList.toggle('on',v==='A'); $('#vB').classList.toggle('on',v==='B'); pinta(); }
function todas(on){ document.querySelectorAll('#drw details.tp').forEach(d=>{ d.open=on; ABERTO[d.dataset.k]=on; }); }
function mover(k){ if(k===C.etapa) return; C.etapa=k; pinta(); toast('Etapa: '+TRILHA.find(x=>x[0]===k)[1]+' · registrado no histórico'); }

let MENU=null;
function fechaMenu(){ if(MENU){ MENU.remove(); MENU=null; } }
function menu(ev,q){ ev.stopPropagation(); fechaMenu(); const m=document.createElement('div'); m.className='menu';
  const H={zap:`<div class="mh">WhatsApp · nada é enviado sozinho</div><button type="button" onclick="toast('Abre a conversa')">Abrir conversa</button><button type="button" onclick="toast('Mensagem pronta: abordagem, revisão, apólice emitida…')">Mensagem pronta</button><div class="mh">Registrar</div><button type="button" onclick="toast('WhatsApp enviado')">WhatsApp enviado</button><button type="button" onclick="toast('WhatsApp respondido')">WhatsApp respondido</button>`,
   lig:`<div class="mh">${esc(C.tel)}</div><button type="button" onclick="toast('Disca')">📞 Ligar agora</button><div class="mh">Como foi?</div>${['Ligação atendida','Não atendeu','Caixa postal','Agendou C2','Sem interesse (encerra)'].map(x=>`<button type="button" onclick="toast('${x}')">${x}</button>`).join('')}`,
   mais:`<div class="mh">Este negócio</div><button type="button" onclick="toast('Congelado: some dos alertas até a data')">❄️ Congelar oportunidade</button><button type="button" onclick="toast('Delay marcado')">⏳ Delay (remarcou)</button><button type="button" onclick="toast('Sobe/desce na coluna')">↕ Ordem na coluna</button><button type="button" onclick="toast('Arraste os tópicos e esconda o que não usa')">⋮⋮ Organizar tópicos</button><button type="button" onclick="toast('Compartilhar com outro LP')">👥 Compartilhar</button><button type="button" class="perigo" onclick="toast('Pede confirmação antes')">🗑 Excluir oportunidade</button>`,
   enc:`<div class="mh">Encerrar · pede o motivo</div>${ENC.map(([k,l])=>`<button type="button" onclick="toast('${l}: escolha o motivo')">${l}</button>`).join('')}`};
  m.innerHTML=H[q]; document.body.appendChild(m); MENU=m; const r=ev.currentTarget.getBoundingClientRect(), w=m.offsetWidth, h=m.offsetHeight;
  let x=Math.min(r.left,innerWidth-w-16), y=r.bottom+6; if(y+h>innerHeight-10) y=Math.max(10,r.top-h-6); m.style.left=Math.max(16,x)+'px'; m.style.top=y+'px'; }
document.addEventListener('click',e=>{ if(MENU&&!MENU.contains(e.target)) fechaMenu(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fechaMenu(); });
pinta();
</script>
