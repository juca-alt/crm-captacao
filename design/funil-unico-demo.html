<title>Funil Único · demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: o mesmo app do CRM Life Planner (Visão LP) — barra de ferramentas + filtros em chips + quadro de colunas roláveis; no celular as colunas viram abas. */
:root{
  color-scheme:light;
  --primary:#2563eb; --navy:#0f172a; --azul-claro:#eff6ff; --azul-borda:#bfdbfe;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --linha:#e2e8f0; --linha2:#cbd5e1;
  --verde:#16a34a; --verde-bg:#dcfce7; --amarelo:#b45309; --amarelo-bg:#fef3c7;
  --verm:#dc2626; --verm-bg:#fee2e2; --roxo:#7c3aed; --roxo-bg:#ede9fe; --cinza:#5b6770; --cinza-bg:#f1f5f9;
  --laranja:#ea580c; --laranja-bg:#fff7ed;
  --card:#ffffff; --fundo:#f1f5f9; --radius:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--fundo);color:var(--ink);font-family:var(--font);font-size:14px;margin:0}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 90px;max-width:100%}
.demo-bar{background:var(--navy);color:#e2e8f0;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.demo-bar b{color:#fff}
.demo-bar .sp{flex:1}
.fseg{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap}
.fseg button{border:1px solid var(--linha);background:#fff;border-radius:10px;padding:9px 14px;min-height:44px;font-size:14px;font-weight:600;color:var(--ink2);display:inline-flex;gap:8px;align-items:center}
.fseg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fseg .n{font-size:12px;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.demo-bar button{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:6px 10px;min-height:36px}
h1{font-size:22px;margin:14px 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
/* toolbar */
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:#fff;border-radius:9px;padding:7px 12px;min-height:38px;font-size:13px;color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--ink)}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.on{background:var(--azul-claro);border-color:var(--azul-borda);color:#1d4ed8}
.btn.mini{min-height:30px;padding:4px 9px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:9px;overflow:hidden;background:#fff}
.seg button{padding:7px 12px;min-height:38px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--primary);color:#fff}
.busca{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--linha);border-radius:9px;padding:0 10px;min-height:38px}
.busca input{border:0;outline:0;flex:1;min-width:0;background:transparent;padding:8px 0}
/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink2);min-height:32px}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.on .n{color:#dbeafe}
.chip select{border:0;background:transparent;padding:0;font-size:12.5px;color:inherit;outline:0}
.chip.sel{padding-right:6px}
.enc-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.enc-row .chip{border-style:dashed}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 288px;background:#e9eef4;border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px;scroll-snap-align:start}
.col.enc{background:#f8eaea}
.col.drop{outline:2px dashed var(--primary);outline-offset:-2px;background:var(--azul-claro)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.col-h .dot{width:9px;height:9px;border-radius:50%}
.col-h b{font-size:13.5px}
.col-h .q{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-sub{font-size:11.5px;color:var(--muted);padding:0 4px 2px}
.vazio{font-size:12px;color:var(--muted);text-align:center;padding:14px 6px;border:1px dashed var(--linha2);border-radius:10px}
/* card */
.nc{background:var(--card);border:1px solid var(--linha);border-radius:11px;padding:10px 10px 0;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.nc:hover{border-color:var(--linha2)}
.nc.semprox{background:var(--laranja-bg);border-color:#fdba74}
.nc.sel-on{outline:2px solid var(--primary)}
.nc-top{display:flex;align-items:flex-start;gap:6px}
.nc-nome{font-weight:650;font-size:14px;line-height:1.25;flex:1;min-width:0}
.nc-nome .completa{color:var(--roxo);font-size:12px;margin-left:3px}
.ib{width:26px;height:26px;border-radius:50%;border:1px solid var(--linha);color:var(--muted);font-size:12px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.ck{width:20px;height:20px;accent-color:var(--primary);margin-top:1px}
.stars{display:inline-flex;gap:1px;font-size:15px;line-height:1}
.stars button{color:#cbd5e1;padding:0 1px}
.stars button.f{color:#f59e0b}
.stars.man button.f{color:var(--verde)}
.stars.unlock button{color:#94a3b8}
.stars.unlock button.f{color:#f59e0b}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.bd{font-size:11px;border-radius:6px;padding:2px 6px;background:var(--cinza-bg);color:var(--cinza);white-space:nowrap}
.bd.v{background:var(--verde-bg);color:#15803d}.bd.a{background:var(--amarelo-bg);color:var(--amarelo)}
.bd.r{background:var(--roxo-bg);color:var(--roxo)}.bd.b{background:var(--azul-claro);color:#1d4ed8}
.bd.vm{background:var(--verm-bg);color:#b91c1c}.bd.lj{background:#ffedd5;color:#c2410c}
.aviso{font-size:12px;color:#c2410c;font-weight:600}
.stt{font-size:11.5px;color:var(--ink2);background:var(--cinza-bg);border-radius:6px;padding:2px 7px;align-self:flex-start}
.stt.dl{background:var(--amarelo-bg);color:var(--amarelo)}
.prox{font-size:12px;color:var(--ink2)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--linha);margin:2px -10px 0}
.qa button{min-height:38px;font-size:12px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:3px}
.qa button+button{border-left:1px solid var(--linha)}
.qa button:hover{background:var(--fundo)}
/* tabs mobile */
.tabs{display:none;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.tabs button{flex:0 0 auto;border:1px solid var(--linha);background:#fff;border-radius:999px;padding:8px 12px;min-height:44px;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
/* table */
.tw{overflow-x:auto;background:#fff;border:1px solid var(--linha);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:1200px}
th,td{padding:8px 10px;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top}
th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:#f8fafc;position:sticky;top:0;white-space:nowrap}
th button{text-transform:inherit;letter-spacing:inherit;color:inherit;font-weight:700}
td.num{font-variant-numeric:tabular-nums;text-align:right}
tr:hover td{background:#f8fafc}
/* overlay / modal / drawer */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.ov[hidden]{display:none!important}
.md{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.md h2{margin:0;font-size:18px}
.md .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:#fff;z-index:60;box-shadow:-8px 0 30px rgba(15,23,42,.18);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease}
.drw.on{transform:none}
.drw-h{padding:14px 16px 10px;border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:8px;padding-top:max(14px,env(safe-area-inset-top,0px))}
.drw-h .l1{display:flex;gap:8px;align-items:center}
.drw-h h2{margin:0;font-size:18px;flex:1;min-width:0}
.salvo{font-size:12px;color:var(--verde)}
.mut{font-size:12.5px;color:var(--muted)} .mut2{font-size:13.5px;color:var(--ink2)}
.dlink{color:var(--primary);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;padding:2px 0;text-align:left}
.dtabs .dlink{margin-left:auto;white-space:nowrap;text-decoration:none;padding:7px 8px}
.snl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.tarl{display:flex;gap:8px;align-items:center;font-size:13px;min-height:32px}.tarl small{color:var(--muted);margin-left:auto}.tarl input{accent-color:var(--primary);width:18px;height:18px}
.riscado{text-decoration:line-through;color:var(--muted)}
.tarnova{display:flex;gap:6px;flex-wrap:wrap}.tarnova input{flex:1 1 140px;min-width:0;border:1px solid var(--linha);border-radius:8px;padding:6px 8px;min-height:34px}
.cotl{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.pg{position:fixed;inset:0;z-index:65;background:var(--fundo);overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.pg-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pg-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--fundo);padding:max(10px,env(safe-area-inset-top,0px)) 0 10px;margin-bottom:2px;border-bottom:1px solid var(--linha)}
.pg-bar .voltar{font-weight:650;min-height:42px}

.pg.painel.on{transform:none}

.pg.painel .pg-cols{flex-direction:column}

.pg.painel .pcard0{padding:14px 16px}.pg.painel .pcard0 h2{font-size:19px}

.pcard0 h2{margin:0;font-size:22px}.pc-l{display:flex;flex-direction:column;gap:6px;min-width:0}.pc-a{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.pg-cols{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}.pg-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:14px}.pg-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px}
.pcard{background:#fff;border:1px solid var(--linha);border-radius:12px;overflow:hidden}.pcard.pad{padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.pch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--linha);font-size:15px}
.pch0{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.negrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;width:100%;padding:11px 14px;border-bottom:1px solid var(--linha);font-size:13.5px;text-align:left;min-height:44px}.negrow:hover{background:#f8fafc}
.negr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.negr .mut{font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tiles div{background:#f8fafc;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}.tiles span{font-size:12px;color:var(--muted)}
.hfs{display:flex;gap:6px;flex-wrap:wrap}
.covl{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;padding-bottom:8px;border-bottom:1px dashed var(--linha)}.covl label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);font-weight:600;min-width:0}.covl input{min-width:0;border:1px solid var(--linha);border-radius:8px;padding:6px 8px;min-height:36px;font-weight:400;color:var(--ink)}
.calc{min-height:38px;display:flex;align-items:center;gap:6px;font-weight:650}

const RAPIDOS=['semprox','ta','quente','nunca'];
const FILTROS=[['nunca','Nunca conversei',nunca],['lead','Lead',c=>c.origem==='lead'],['parceiro','Parceiro',c=>c.origem==='parceiro'],['qparc','Quer ser parceiro',c=>c.quer_parceiro],['emerg','Emergência',c=>c.emergencia],
 ['mx','Mercado X',c=>c.mercado==='X'],['my','Mercado Y',c=>c.mercado==='Y'],['mz','Mercado Z',c=>c.mercado==='Z'],['quente','Quentes',c=>c.quente||(S.funil==='vi'&&anceVal(c)>=4)],['alta','Alta Renda',altaRenda],
 ['delay','Delay',c=>c.delay],['semdelay','Sem delay',c=>!c.delay],['niver','Aniversariantes (out)',c=>c.niverMes===10],['ta','Fazer TA',c=>c.fazerTA],['semprox','⚠ Sem próximo passo',semProx]];
function bateBusca(c,q){ if(!q) return true; const n=norm(q);
  return [c.nome,c.apelido,c.cidade,c.prof,c.recomendante,E[c.etapa].l,c.renda,c.tel,c.email,c.obs,(c.tags||[]).join(' '),c.mercado?'mercado '+c.mercado:'',ORIG[c.origem],LINHA[c.linha],c.criado&&br(c.criado)].some(x=>x!=null&&norm(x).includes(n)); }
function passa(c,ignora){ if(!bateBusca(c,S.q)) return false;
  for(const [k,,fn] of FILTROS){ if(k!==ignora&&S.f[k]&&!fn(c)) return false; }
  if(S.linha&&c.linha!==S.linha) return false; if(S.origem&&c.origem!==S.origem) return false; if(S.dono&&c.dono!==S.dono) return false; return true; }
const visiveis=()=>doFunil().filter(c=>passa(c));
function ordenar(l){ const o=S.ordem; return l.slice().sort((a,b)=> o==='nome'?a.nome.localeCompare(b.nome): o==='prob'?(E[b.etapa].p-E[a.etapa].p)||a.nome.localeCompare(b.nome): o==='ag'?String((a.prox&&a.prox.quando)||'9').localeCompare(String((b.prox&&b.prox.quando)||'9')): String(b.criado).localeCompare(String(a.criado))); }

/* ── render ── */
const $=s=>document.querySelector(s);
function render(){ const F=FUNIS[S.funil]; 
  $('#fn-vi').classList.toggle('on',S.funil==='vi'); $('#fn-mfo').classList.toggle('on',S.funil==='mfo');
  $('#fn-vi .n').textContent=S.cards.filter(c=>c.funil==='vi').length; $('#fn-mfo .n').textContent=S.cards.filter(c=>c.funil==='mfo').length;
  if(S.layout==='atual'){ $('#chips').className='chips'; renderChips(); } else renderChipsAB(); renderEnc(); const cn=$('#cols-n'); if(cn) cn.textContent=(colsPref().ordem.length-colsPref().ocultas.length)+'/'+COLS_PAD.length;
  if(S.sheet&&!$('#ov').hidden) $('#md').innerHTML=sheetHtml();
  $('#v-k').classList.toggle('on',S.view==='k'); $('#v-t').classList.toggle('on',S.view==='t');
  if(S.view==='k') renderBoard(); else renderTabela(); renderSelbar(); }
function renderChips(){ const base=doFunil().filter(c=>bateBusca(c,S.q));
  const h=FILTROS.map(([k,l,fn])=>`<button type="button" class="chip${S.f[k]?' on':''}" data-f="${k}">${esc(l)} <span class="n">${base.filter(fn).length}</span></button>`).join('');
  const sel=(id,lab,opts,v)=>`<span class="chip sel${v?' on':''}"><label for="${id}">${lab}</label><select id="${id}"><option value="">todas</option>${opts.map(([k,t])=>`<option value="${k}" ${k===v?'selected':''}>${t}</option>`).join('')}</select></span>`;
  $('#chips').innerHTML=h+(S.funil==='mfo'?sel('f-linha','Linha',LINHAS_DO.mfo.map(k=>[k,LINHA[k]]),S.linha):'')+sel('f-origem','Origem',Object.entries(ORIG),S.origem)+sel('f-dono','Dono',[['Gustavo','Gustavo'],['Victor','Victor'],['Daniel','Daniel']],S.dono)
   +(Object.values(S.f).some(Boolean)||S.linha||S.origem||S.dono?`<button type="button" class="chip" id="f-limpa">✕ limpar filtros</button>`:''); }
function renderEnc(){ const v=visiveis();
  if(S.layout!=='atual'){ $('#enc').className='qrow'; $('#enc').innerHTML='<span class="fc txt">Encerrados:</span>'+ETAPAS.filter(e=>e.enc).map(e=>`<button type="button" class="fc enc${S.encAbertas[e.id]?' on':''}" data-enc="${e.id}">${e.l} <span class="cn">${v.filter(c=>c.etapa===e.id).length}</span></button>`).join(''); return; }
  $('#enc').className='enc-row'; $('#enc').innerHTML='Encerramentos (recolhidos):'+ETAPAS.filter(e=>e.enc).map(e=>`<button type="button" class="chip${S.encAbertas[e.id]?' on':''}" data-enc="${e.id}">${e.l} <span class="n">${v.filter(c=>c.etapa===e.id).length}</span></button>`).join(''); }
function colunas(){ const p=colsPref(); return p.ordem.filter(id=>!p.ocultas.includes(id)).concat(ETAPAS.filter(e=>e.enc&&S.encAbertas[e.id]).map(e=>e.id)); }
function renderBoard(){ const v=visiveis(), cols=colunas();
  if(!cols.includes(S.tabMob)) S.tabMob=cols[0];
  $('#tabs').innerHTML=cols.map(id=>`<button type="button" class="${id===S.tabMob?'on':''}" data-tab="${id}">${E[id].l} · ${v.filter(c=>c.etapa===id).length}</button>`).join('');
  $('#view').innerHTML=`<div class="board">${cols.map(id=>{ const e=E[id], cs=ordenar(v.filter(c=>c.etapa===id));
    const sub=e.enc?'encerramento · fora do funil':e.pos?'pós-venda · não soma no funil':`prob. ${e.p}%`+(cs.filter(semProx).length?` · ⚠ ${cs.filter(semProx).length} sem próximo passo`:'');
    return `<section class="col${e.enc?' enc':''}${id===S.tabMob?' vis':''}" data-col="${id}" aria-label="${esc(e.l)}"><div class="col-h"><span class="dot" style="background:${e.cor}"></span><b>${esc(e.l)}</b><span class="q">${cs.length}</span></div><div class="col-sub">${sub}</div>
      ${cs.length?cs.map(cardHtml).join(''):`<div class="vazio">Nenhum card aqui${Object.values(S.f).some(Boolean)||S.q?' com estes filtros':''}</div>`}</section>`; }).join('')}</div>`; }
function starsHtml(c){ const n=anceVal(c), man=c.anceManual!=null, un=S.unlock===c.id;
  let h=''; for(let i=1;i<=5;i++) h+=`<button type="button" class="${i<=n?'f':''}" data-star="${i}" aria-label="${i} estrela${i>1?'s':''}">★</button>`;
  return `<span class="stars${man?' man':''}${un?' unlock':''}" data-stars="${c.id}" title="ANCE ${n}/5 ${man?'(manual · automático daria '+anceAuto(c)+')':'(automático pelas regras)'} — 1º toque libera, 2º grava">${h}</span>`; }
function cardHtml(c){ const st=statusCard(c), sp=semProx(c);
  const bds=[c.cliente_ativo?'<span class="bd v">Cliente · apólice ativa</span>':'', c.mercado?`<span class="bd b">Mercado ${c.mercado}</span>`:'', S.funil==='mfo'?`<span class="bd r">${LINHA[c.linha]}</span>`:'',
    `<span class="bd">${ORIG[c.origem]}</span>`, c.recCliente?'<span class="bd v">Rec. de cliente</span>':'', altaRenda(c)?'<span class="bd a">Alta renda</span>':'', esfriando(c)?'<span class="bd lj">❄ esfriando</span>':'', (c.quente||(S.funil==='vi'&&anceVal(c)>=4))&&!enc(c)?'<span class="bd vm">🔥 quente</span>':''].join('');
  const sel=S.sel?`<input type="checkbox" class="ck" data-ck="${c.id}" ${S.sel.has(c.id)?'checked':''} aria-label="Selecionar ${esc(c.nome)}">`:'';
  return `<article class="nc${sp?' semprox':''}${S.sel&&S.sel.has(c.id)?' sel-on':''}" draggable="true" data-card="${c.id}">
    <div class="nc-top">${sel}<div class="nc-nome">${esc(c.nome)}${c.completa?'<span class="completa" title="Ficha completa">✦</span>':''}</div><button type="button" class="ib" data-info="${c.id}" aria-label="Resumo">ⓘ</button></div>
    ${S.funil==='vi'?`<div>${starsHtml(c)}</div>`:''}
    <div class="meta">${c.funil==='mfo'?`<span><b style="color:var(--ink2)">${esc(c.produto||'')}</b></span>`:''}<span>${esc(c.funil==='mfo'&&/Empresa/.test(c.prof)?c.prof:c.funil==='mfo'?'':c.prof)}</span><span>${esc(c.cidade)}</span><span>${brl(c.renda)}</span></div>
    ${c.prox?`<div class="prox">📅 ${c.prox.tipo==='reuniao'?'Reunião':c.prox.tipo==='ligar'?'Ligar':'WhatsApp'} ${br(c.prox.quando)}${c.prox.hora?' · '+c.prox.hora:''}</div>`:''}
    ${st?`<span class="stt ${st[0]}">${esc(st[1])}</span>`:''}
    ${c.motivo&&enc(c)?`<span class="stt">✖ ${esc(c.motivo)}</span>`:''}
    <div class="badges">${bds}</div>
    ${sp?'<div class="aviso">⚠ Sem próximo passo</div>':''}
    <div class="qa"><button type="button" data-qa="feito" data-id="${c.id}" title="Marcar a reunião desta etapa como realizada">✓ Feita</button><button type="button" data-qa="delay" data-id="${c.id}" title="Delay (remarcou)">✕ Delay</button><button type="button" data-qa="ligar" data-id="${c.id}" title="Ligar">☏ Ligar</button><button type="button" data-qa="wa" data-id="${c.id}" title="WhatsApp">💬 Zap</button></div>
  </article>`; }
const COLS_T=[['nome','Nome'],['criado','Criado em'],['prob','Prob. negócio'],['etapa','Etapa'],['rec','Recomendante'],['prof','Profissão'],['renda','Renda'],['cidade','Cidade'],['sitplan','SitPlan'],['tags','Tags'],['obs','Observação'],['mercado','Mercado'],['acoes','Ações']];
function renderTabela(){ $('#tabs').innerHTML=''; const l=ordenar(visiveis());
  $('#view').innerHTML=`<div class="tw"><table><thead><tr>${COLS_T.map(([k,t])=>`<th>${k==='prob'?`<button type="button" data-ord="prob">${t} ↓</button>`:k==='nome'?`<button type="button" data-ord="nome">${t}</button>`:t}</th>`).join('')}</tr></thead><tbody>
  ${l.map(c=>`<tr><td><button type="button" data-abrir="${c.id}" style="font-weight:600;text-align:left">${esc(c.nome)}</button></td><td>${br(c.criado)}</td><td class="num">${E[c.etapa].p}%</td><td><span class="bd" style="color:${E[c.etapa].cor}">${esc(E[c.etapa].l)}</span></td><td>${esc(c.recomendante||'—')}</td><td>${esc(c.prof)}</td><td class="num">${brl(c.renda)}</td><td>${esc(c.cidade)}</td><td>${c.sitplan?br(c.sitplan.data)+' · '+esc(RL[c.sitplan.res]||''):'—'}</td><td>${esc((c.tags||[]).join(', ')||'—')}</td><td>${esc(c.obs||'—')}</td><td>${c.mercado||'—'}</td><td><button type="button" class="btn mini" data-qa="ligar" data-id="${c.id}">☏</button> <button type="button" class="btn mini" data-qa="wa" data-id="${c.id}">💬</button></td></tr>`).join('')}
  </tbody></table></div><p class="sub" style="margin-top:8px">${l.length} de ${doFunil().length} · mesmos filtros e mesmas contagens do Kanban · ⋮ exporta .xlsx com estas colunas</p>`; }
function renderSelbar(){ const el=$('#selbar'); if(!S.sel){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="selbar"><b>${S.sel.size} selecionado(s)</b><select id="sel-et" aria-label="Mover para"><option value="">Mover para…</option>${ETAPAS.map(e=>`<option value="${e.id}">${e.l}</option>`).join('')}</select><select id="sel-mc" aria-label="Mercado"><option value="">Marcar mercado…</option><option>X</option><option>Y</option><option>Z</option></select><button type="button" id="sel-sp">📋 Enviar pro SitPlan de hoje</button><button type="button" id="sel-sair">Sair da seleção</button></div>`; }

    <button class="btn" type="button" id="b-sel">☑ Selecionar</button>
    <label class="btn" for="ordem">↕ <select id="ordem" style="border:0;background:transparent;outline:0">
      <option value="rec">Mais recentes</option><option value="ag">Data de agendamento</option><option value="prob">Prob. negócio</option><option value="nome">Nome</option></select></label>
    <button class="btn" type="button" id="b-cols">▥ Colunas <span id="cols-n"></span></button>

`;
const F_DEF=Object.fromEntries(FILTROS.map(x=>[x[0],x]));
function nFiltro(k){ const fn=F_DEF[k][2]; return doFunil().filter(c=>passa(c,k)&&fn(c)).length; }
function fcHtml(k,curto){ const n=nFiltro(k), on=!!S.f[k]; return `<button type="button" class="fc${on?' on':''}${!n&&!on?' zero':''}" data-f="${k}" aria-pressed="${on}">${esc(curto&&CURTO[k]?CURTO[k]:F_DEF[k][1])} <span class="cn">${n}</span></button>`; }
function mercSeg(){ return `<span class="fseg2" role="group" aria-label="Mercado">${['mx','my','mz'].map(k=>`<button type="button" class="${S.f[k]?'on':''}" data-f="${k}">${CURTO[k]} <span class="cn">${nFiltro(k)}</span></button>`).join('')}</span>`; }
function selF(id,lab,opts,v){ return `<select class="fsel" id="${id}" aria-label="${lab}"><option value="">${lab}: todas</option>${opts.map(([k,t])=>`<option value="${k}" ${k===v?'selected':''}>${lab}: ${t}</option>`).join('')}</select>`; }
function selsExtra(){ return (S.funil==='mfo'?selF('f-linha','Linha',LINHAS_DO.mfo.map(k=>[k,LINHA[k]]),S.linha):'')+selF('f-origem','Origem',Object.entries(ORIG),S.origem)+selF('f-dono','Dono',[['Gustavo','Gustavo'],['Victor','Victor'],['Daniel','Daniel']],S.dono); }
function ativos(){ const a=Object.keys(S.f).filter(k=>S.f[k]&&F_DEF[k]).map(k=>[k,F_DEF[k][1]]);
  if(S.linha) a.push(['@linha','Linha: '+LINHA[S.linha]]); if(S.origem) a.push(['@origem','Origem: '+ORIG[S.origem]]); if(S.dono) a.push(['@dono','Dono: '+S.dono]); return a; }
const pillsAtivos=()=>ativos().map(([k,l])=>`<button type="button" class="fc ativo" data-frm="${k}" aria-label="Tirar ${esc(l)}">${esc(l)} ✕</button>`).join('');
function renderTb(){ const el=$('#tbx'); const L=S.layout;
  if(L==='atual') el.innerHTML=TB_ATUAL;
  else if(L==='A') el.innerHTML=`<div class="trow tA"><label class="busca" for="q">🔎 <input id="q" type="search" placeholder="Buscar nome, cidade, profissão…" autocomplete="off"></label><button type="button" class="btn" id="b-filtros">⚙ Filtros <span class="cnt" id="fcnt" hidden></span></button></div>
    <div class="trow tA"><button type="button" class="btn p nova" id="b-nova">＋ Nova recomendação</button><div class="seg ic" role="group" aria-label="Vista"><button type="button" id="v-k" title="Kanban" aria-label="Kanban">▦</button><button type="button" id="v-t" title="Tabela" aria-label="Tabela">☰</button></div><button type="button" class="btn" id="b-mais" aria-label="Mais opções">⋯</button></div>`;
  else el.innerHTML=`<div class="trow"><label class="busca" for="q">🔎 <input id="q" type="search" placeholder="Buscar em qualquer coluna" autocomplete="off"></label><label class="btn hide-m" for="ordem" title="Ordenar">↕ <select id="ordem" style="border:0;background:transparent;outline:0;max-width:150px"><option value="rec">Mais recentes</option><option value="ag">Agendamento</option><option value="prob">Prob. negócio</option><option value="nome">Nome</option></select></label><div class="seg ic" role="group" aria-label="Vista"><button type="button" id="v-k" title="Kanban" aria-label="Kanban">▦</button><button type="button" id="v-t" title="Tabela" aria-label="Tabela">☰</button></div></div>
    <div class="trow rola"><button type="button" class="btn p" id="b-nova">＋ Nova recomendação</button><button type="button" class="btn" id="b-sitplan">📋 SitPlans</button><button type="button" class="btn" id="b-sel">☑ Selecionar</button><button type="button" class="btn" id="b-cols">▥ Colunas</button><button type="button" class="btn" id="b-mais" aria-label="Mais opções">⋯</button></div>`;
  const q=$('#q'); if(q) q.value=S.q; const o=$('#ordem'); if(o) o.value=S.ordem;
  document.querySelectorAll('[data-lay]').forEach(b=>b.classList.toggle('on',b.dataset.lay===L)); }
function renderChipsAB(){ const el=$('#chips'); const n=ativos().length;
  const fc=$('#fcnt'); if(fc){ fc.hidden=!n; fc.textContent=n; }
  if(S.layout==='A'){ const extra=ativos().filter(([k])=>!RAPIDOS.includes(k));
    el.className='qrow'; el.innerHTML=RAPIDOS.map(k=>fcHtml(k,true)).join('')+(extra.length?'<span class="fsep"></span>'+extra.map(([k,l])=>`<button type="button" class="fc ativo" data-frm="${k}">${esc(l)} ✕</button>`).join(''):'')+(n?`<button type="button" class="fc txt" id="f-limpa">limpar</button>`:''); return; }
  el.className=''; el.innerHTML=`<div class="fpan${S.fpan?' aberta':''}"><div class="fpan-h"><button type="button" class="tt" data-x="fpan" aria-expanded="${S.fpan}">Filtros${n?' · '+n:''}</button><span class="pills">${n?pillsAtivos():`<button type="button" class="fc txt" data-x="fpan">nenhum · toque pra filtrar</button>`}</span></div>
    ${S.fpan?`<div class="fpan-b">${GRUPOS.map(([g,ks])=>`<div class="frow"><span class="lb">${g}</span><div class="rs">${g==='Mercado'?mercSeg():ks.map(k=>fcHtml(k,true)).join('')}</div></div>`).join('')}
      <div class="frow"><span class="lb">Mais</span><div class="rs">${selsExtra()}</div></div>${n?`<div><button type="button" class="fc txt" id="f-limpa">✕ limpar filtros</button></div>`:''}</div>`:''}</div>`; }
function sheetHtml(){ const v=visiveis().length;
  return `<h2>⚙ Filtros</h2>${GRUPOS.map(([g,ks])=>`<div class="fgrp"><h3>${g}</h3><div class="fgrid">${g==='Mercado'?mercSeg():ks.map(k=>fcHtml(k,true)).join('')}</div></div>`).join('')}
   <div class="fgrp"><h3>Mais</h3><div class="fgrid">${selsExtra()}</div></div>
   <div class="sheet-f"><button type="button" class="btn" id="f-limpa">Limpar</button><button type="button" class="btn p" data-x="fechar">Ver ${v} card${v===1?'':'s'}</button></div>`; }
function abrirSheet(){ S.sheet=true; $('#ov').classList.add('sheet'); modal(sheetHtml()); }

/* ── ações ── */
let tt=null; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>{t.hidden=true;},3200); }
const card=id=>S.cards.find(c=>c.id===id);
function hist(c,t){ c.hist.push({q:iso(HOJE),t}); }
function registrar(c,tipo){ c.ultimo={tipo,quando:iso(HOJE)}; c.fazerTA=false; hist(c,'Contato: '+(RL[tipo]||tipo)); }
function mover(c,dest,motivo){ if(c.etapa===dest) return;
  if(E[dest].enc&&!motivo){ return pedirMotivo(c,dest); }
  if(S.funil==='vi'&&dest==='emitida'&&!c.cliente_ativo) toast('Não achei apólice desse nome na carteira — vai como emitida manual');
  const de=E[c.etapa].l; c.etapa=dest; c.delay=false; if(E[dest].enc){ c.motivo=motivo; c.prox=null; }
  hist(c,'Etapa: '+de+' → '+E[dest].l+(motivo?' · motivo: '+motivo:'')); if(!E[dest].enc&&!motivo) toast(c.apelido+' → '+E[dest].l); render(); if(S.aberto===c.id) reRenderFicha(); }
function modal(html){ if(!S.sheet) $('#ov').classList.remove('sheet'); $('#md').innerHTML=html; $('#ov').hidden=false; const f=$('#md').querySelector('select,input,textarea,button'); if(f) f.focus(); }
function fechaModal(){ $('#ov').hidden=true; $('#md').innerHTML=''; S.sheet=false; $('#ov').classList.remove('sheet'); }
function pedirMotivo(c,dest){ modal(`<h2>Encerrar ${esc(c.apelido)} em “${esc(E[dest].l)}”</h2><p class="sub" style="margin:0">Sem motivo não encerra. A lista de motivos vem de Funil & Etapas.</p>

function mfoGerarExtra(c,r,pick){ const p=c.produto;

  c.situacao=p==='Patrimonial / Empresarial'||p==='Vida de outra seguradora'?'terceiro':c.etapa==='ativo'?'nossa':'nova';
  c.fechaPor=p==='Jurídico / recuperação'||p==='Crédito / passivo bancário'?'Parceiro':p==='Patrimonial / Empresarial'?'Outliers':'Prudential';
  c.parceiro=c.fechaPor==='Parceiro'?(p==='Jurídico / recuperação'?'Escritório parceiro':'Correspondente bancário'):'';
  c.seguradora=p==='Vida em Grupo'?'Prudential':p==='Patrimonial / Empresarial'?pick(['Aliança do Brasil','Zurich']):p==='Vida de outra seguradora'?'Zurich Santander':p==='Previdência'?'XP':'—';
  c.corretoraAtual=c.situacao==='terceiro'?pick(['BB Corretora','Corretora do banco']):'';

  if(t.closest('#drw')&&t.dataset.k&&(t.tagName==='SELECT'||t.type==='checkbox')) salvarCampo(t);
});
document.addEventListener('input',ev=>{ const t=ev.target; if(t.dataset&&t.dataset.cov!=null){ const c=card(S.aberto); c.coberturas[Number(t.dataset.cov)][t.dataset.cf]=t.value; return; } if(t.dataset&&t.dataset.tel!=null){ const c=card(S.aberto); (c.tels=c.tels||[c.tel])[Number(t.dataset.tel)]=t.value; c.tel=c.tels[0]; return; } if(t.id==='q'){ S.q=t.value; clearTimeout(window._qT); window._qT=setTimeout(render,180); return; }
  if(t.closest('#drw')&&t.dataset.k&&t.tagName!=='SELECT'&&t.type!=='checkbox') salvarCampo(t); });
document.addEventListener('toggle',ev=>{ const e=ev.target; if(e.tagName==='DETAILS'&&e.dataset.dobra) DOBRA[e.dataset.dobra]=e.open; },true);
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ if(menuEl) fechaMenu(); else if(!$('#ov').hidden) fechaModal(); else if(S.aberto){ if(!$('#pg').hidden) fecharPg(); else { S.aberto=null; $('#drw').classList.remove('on'); } } } });
/* arrastar (desktop) */
let drag=null;
document.addEventListener('dragstart',ev=>{ const c=ev.target.closest&&ev.target.closest('[data-card]'); if(!c) return; drag=c.dataset.card; ev.dataTransfer.effectAllowed='move'; try{ ev.dataTransfer.setData('text/plain',drag); }catch(_){} });
document.addEventListener('dragover',ev=>{ const col=ev.target.closest&&ev.target.closest('[data-col]'); if(!col||!drag) return; ev.preventDefault(); document.querySelectorAll('.col.drop').forEach(x=>x!==col&&x.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('dragleave',ev=>{ const col=ev.target.closest&&ev.target.closest('[data-col]'); if(col&&!col.contains(ev.relatedTarget)) col.classList.remove('drop'); });
document.addEventListener('drop',ev=>{ const col=ev.target.closest&&ev.target.closest('[data-col]'); document.querySelectorAll('.col.drop').forEach(x=>x.classList.remove('drop')); if(!col||!drag) return; ev.preventDefault(); const c=card(drag); drag=null; mover(c,col.dataset.col); });
document.addEventListener('dragend',()=>{ drag=null; document.querySelectorAll('.col.drop').forEach(x=>x.classList.remove('drop')); });
renderTb();
render();
})();
</script>
