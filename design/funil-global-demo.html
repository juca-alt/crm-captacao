<title>Funil com cara do Global</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: o quadro do Funil novo do CRM Visão LP com a cara do Global — barra de ações no topo, painel "Filtros rápidos" com chips coloridos
   e contagem, busca com "x de y resultados", colunas com alça ⠿ (arrastar reordena) e ✕ (esconder), cards com alça e "Contato rápido".
   Tema claro único, como o app. */
:root{
  color-scheme:light;
  --primary:#2563eb; --primary-2:#1d4ed8; --navy:#0f172a; --navy-2:#1e293b;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --linha:#e2e8f0; --linha2:#cbd5e1; --fundo:#f1f5f9; --card:#ffffff; --col:#f8fafc;
  --verde:#15803d; --verde-bg:#dcfce7; --amar:#b45309; --amar-bg:#fef3c7; --verm:#b91c1c; --verm-bg:#fee2e2; --roxo:#6d28d9; --roxo-bg:#ede9fe;
  --azul:#1d4ed8; --azul-bg:#dbeafe; --lj:#c2410c; --lj-bg:#ffedd5; --rosa:#be185d; --rosa-bg:#fce7f3; --cinza:#475569; --cinza-bg:#e2e8f0;
  --sp:#9a3412; --sp-bg:#fff7ed; --sp-borda:#fdba74; --estrela:#f59e0b;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--fundo);color:var(--ink);font-family:var(--font);font-size:14px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.demo{background:var(--navy);color:#cbd5e1;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.demo b{color:#fff}
.wrap{padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}

/* topo */
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--linha);background:var(--card);border-radius:9px;padding:0 12px;min-height:36px;font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;gap:8px;align-items:center}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg .n{font-size:12px;font-weight:500;opacity:.75}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bt{min-height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--linha);background:var(--card);font-weight:600;font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bt:hover{border-color:var(--linha2)}
.bt.p{background:var(--primary);border-color:var(--primary);color:#fff}
.bt .nv{background:var(--verde);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;letter-spacing:.04em}
.bt .cn{font-weight:500;color:var(--muted)}
.sp{flex:1}

/* filtros rápidos */
.fr{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fr-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}
.fr-h .lim{margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:0;color:var(--primary-2);min-height:32px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.ch{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 10px;min-height:30px;font-size:12.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}

.t-roxo{background:var(--roxo-bg);color:var(--roxo)}.t-azul{background:var(--azul-bg);color:var(--azul)}.t-lj{background:var(--lj-bg);color:var(--lj)}
.t-rosa{background:var(--rosa-bg);color:var(--rosa)}.t-cinza{background:var(--cinza-bg);color:var(--cinza)}
.grp{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.grp-l{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-width:62px}

.gv-pe{position:sticky;bottom:-16px;background:var(--card);border-top:1px solid var(--linha);margin:auto -16px -16px;padding:12px 16px;display:flex;gap:8px;justify-content:space-between}
details.des{background:transparent}

details.des>summary::-webkit-details-marker{display:none}

th,td{padding:8px 12px;border-bottom:1px solid var(--linha);text-align:left}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--col)}

/* quadro */
.qd{background:var(--card);border:1px solid var(--linha);border-radius:14px;overflow:hidden}
.qd-top{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linha);flex-wrap:wrap}

.busca input{border:0;outline:0;flex:1;min-width:0;background:transparent}
.res{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.board{display:flex;gap:12px;overflow-x:auto;padding:14px;align-items:flex-start;min-height:420px}
.col{flex:0 0 300px;background:var(--col);border:1px solid var(--linha);border-radius:12px;display:flex;flex-direction:column;max-height:70vh}
.col.enc{background:#fdf6f6}
.col.arr{opacity:.4}
.col.alvo{outline:2px dashed var(--primary);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 6px;border-bottom:1px solid var(--linha)}
.alca{cursor:grab;color:var(--linha2);font-size:15px;line-height:1;padding:4px 2px;user-select:none}
.alca:active{cursor:grabbing}
.col-h .ic{font-size:15px}
.col-h b{font-size:14px}
.col-h .qt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.col-h .x{color:var(--muted);min-width:28px;min-height:28px;border-radius:6px;font-size:14px}.col-h .x:hover{background:var(--cinza-bg)}
.col-s{font-size:11.5px;color:var(--muted);padding:6px 12px 0;display:flex;justify-content:space-between;gap:8px}

.cards{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:80px}
.vazio{color:var(--muted);text-align:center;font-size:13px;padding:22px 8px}
.nova-col{flex:0 0 220px;min-height:120px;border:2px dashed var(--linha2);border-radius:12px;color:var(--primary-2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent}

.cd{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:10px 10px 0;display:flex;flex-direction:column;gap:5px;cursor:pointer}

.cd-st{display:flex;align-items:center;gap:4px;padding-left:20px}

.cd-m .r{display:flex;justify-content:space-between;gap:8px}

.cd-b{padding-left:20px;display:flex;gap:4px;flex-wrap:wrap}
.bd{font-size:11px;border-radius:6px;padding:2px 6px;font-weight:600}
.cd-f{display:flex;align-items:center;gap:4px;border-top:1px solid var(--linha);margin:4px -10px 0;padding:4px 8px 4px 12px}

.drop-mark{height:3px;background:var(--primary);border-radius:2px;margin:-5px 0}

.tabs{display:none;gap:6px;overflow-x:auto;padding:10px 14px 0;scrollbar-width:none}

.tabs button{flex:0 0 auto;border:1px solid var(--linha);background:var(--card);border-radius:999px;padding:0 13px;min-height:44px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* modal / menu / toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--card);border-radius:14px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.md h2{margin:0;font-size:18px}
.md .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.crow{display:flex;align-items:center;gap:8px;border:1px solid var(--linha);border-radius:10px;padding:4px 8px;background:var(--card)}
.crow label{flex:1;display:flex;align-items:center;gap:8px;min-height:38px}
.crow .alca{font-size:16px}
.crow.arr{opacity:.4}
.mini{min-width:36px;min-height:36px;border-radius:8px;border:1px solid var(--linha);background:var(--card)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
.fld input,.fld select{border:1px solid var(--linha);border-radius:8px;padding:8px 10px;min-height:42px;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cores{display:flex;gap:8px;flex-wrap:wrap}.cores button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.cores button.on{border-color:var(--navy)}
.note{font-size:12.5px;color:var(--ink2);background:var(--amar-bg);border-radius:8px;padding:8px 10px}
.menu{position:fixed;z-index:50;background:var(--card);border:1px solid var(--linha);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.18);padding:6px;min-width:220px;display:flex;flex-direction:column}
.menu .mh{font-size:11px;color:var(--muted);font-weight:700;padding:6px 10px;text-transform:uppercase;letter-spacing:.05em}
.menu button{text-align:left;padding:0 10px;min-height:40px;border-radius:8px;font-size:13.5px}.menu button:hover{background:var(--fundo)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:760px){
  .barra{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.barra::-webkit-scrollbar{display:none}.barra .bt{flex:0 0 auto}
  .barra .bt .tx{display:none}.barra .bt{padding:0 12px;min-height:44px}.barra .bt.p .tx{display:inline}
  .fr .chips,.fr .grp{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.fr .grp::-webkit-scrollbar{display:none}
  .grp-l{min-width:auto}
  .ch,.sv,.lim2{min-height:44px}.fb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.fb::-webkit-scrollbar{display:none}.fb>*{flex:0 0 auto}
  .ov.gav{align-items:flex-end}.ov.gav .md{max-width:none;height:auto;max-height:88vh;border-radius:16px 16px 0 0}.gv-salvar input{min-height:44px;font-size:16px}.bt{min-height:44px}
  .gv-g .chips{flex-wrap:wrap}
  .busca input,.fld input,.fld select{font-size:16px}.busca{min-height:44px}
  .tabs{display:flex}
  .board{display:block;padding:12px}.board .col{display:none;width:100%;max-height:none}.board .col.vis{display:flex}.nova-col{display:none}
  .alca.col-a{display:none}
  .cd-f button,.col-h .x,.mini,.fr-h .lim{min-width:44px;min-height:44px}
  .g2{grid-template-columns:1fr}
}
</style>

const F=[ /* chave, rótulo, tom, ícone, teste, grupo */
 ['nunca','Nunca conversei','verde','✆',c=>c.nunca,'Ação'],['semp','Sem próximo passo','lj','⚠',semProx,'Ação'],['ta','Fazer TA','azul','☏',c=>c.ta,'Ação'],['delay','Delay','verm','⏳',c=>c.delay,'Ação'],
 ['quente','Quentes','amar','☆',c=>c.ance>=4,'Perfil'],['alta','Alta Renda','cinza','✦',alta,'Perfil'],['niver','Aniversariantes','rosa','🎂',c=>c.niver,'Perfil'],['emerg','Emergência','verm','⛑',c=>c.emerg,'Perfil'],
 ['lead','Lead','azul','✦',c=>c.origem==='lead','Origem'],['rec','Recomendação','roxo','🙌',c=>c.origem==='rec','Origem'],['parc','Parceiro','lj','🤝',c=>c.origem==='parc','Origem'],['qparc','Quer ser parceiro','roxo','🛡',c=>c.querParc,'Origem'],['cart','Carteira','verde','🛡',c=>c.origem==='cart','Origem'],
 ['mx','Mercado X','verde','',c=>c.mercado==='X','Mercado'],['my','Mercado Y','amar','',c=>c.mercado==='Y','Mercado'],['mz','Mercado Z','cinza','',c=>c.mercado==='Z','Mercado'],['msem','Sem mercado','cinza','',c=>!c.mercado,'Mercado']];
const FK=Object.fromEntries(F.map(x=>[x[0],x]));
const doFunil=()=>S.cards.filter(c=>c.funil===S.fid);
const bate=c=>!S.q||(c.nome+' '+c.prof+' '+c.cidade+' '+E(c.etapa).l+' '+(c.renda||'')).toLowerCase().includes(S.q.toLowerCase());
function passa(c,ign){ if(!bate(c)) return false; for(const k in S.f){ if(!S.f[k]||k===ign) continue; if(!FK[k][4](c)) return false; } return true; }
const vis=()=>doFunil().filter(c=>passa(c));
const brl=v=>'R$ '+Number(v).toLocaleString('pt-BR');

function topo(){ const nv=S.cards.filter(c=>c.funil==='vi').length, nm=S.cards.filter(c=>c.funil==='mfo').length, p=colsDe(), n=p.ordem.length-p.ocultas.length;
  return `<div class="seg" role="tablist"><button type="button" class="${S.fid==='vi'?'on':''}" onclick="funil('vi')">🎯 Vida Individual <span class="n">${nv}</span></button><button type="button" class="${S.fid==='mfo'?'on':''}" onclick="funil('mfo')">🏢 MFO <span class="n">${nm}</span></button></div>
  <div class="barra"><button type="button" class="bt" onclick="toast('Abre o SitPlan do dia')">📅 <span class="tx">SitPlans</span></button><button type="button" class="bt" onclick="toast('Abre a árvore de recomendações')">🌳 <span class="tx">Árvore de recomendações</span></button>
   <button type="button" class="bt p" onclick="toast('Abre a Nova recomendação (cole texto, foto, PDF ou contato)')">＋ <span class="tx">Nova recomendação</span></button>
   <button type="button" class="bt" onclick="toast('Modo seleção: marque vários e mova, delay ou exporte de uma vez')">☑ <span class="tx">Selecionar</span></button>
   <button type="button" class="bt" onclick="menuOrdem(event)">⇅ <span class="tx">${({rec:'Mais recentes',prox:'Próximo passo',prob:'Prob. negócio',nome:'Nome'})[S.ordem]}</span> ▾</button>
   <button type="button" class="bt" onclick="modalCols()">▥ <span class="tx">Colunas</span> <span class="cn">(${n}/${p.ordem.length})</span></button>
   <button type="button" class="bt" aria-label="Mais opções" onclick="menuMais(event)">⋮</button></div>`; }
function filtros(){ const at=ativosK();
  return `<section class="fb" aria-label="Filtros"><button type="button" class="bt" onclick="gaveta()">⚙ Filtros${at.length?` <span class="cnt">${at.length}</span>`:''}</button>
   <span class="fb-l">Salvos</span>${S.salvos.map((x,i)=>`<button type="button" class="sv${igual(x.f)?' on':''}" onclick="aplica(${i})">${esc(x.n)} <span class="q">${contaF(x.f)}</span></button>`).join('')}
   ${at.length&&!S.salvos.some(x=>igual(x.f))?'<span class="sep"></span>'+at.map(k=>`<button type="button" class="ch t-${FK[k][2]} on" onclick="filtro('${k}')">${esc(FK[k][1])}</button>`).join(''):''}${at.length?'<button type="button" class="lim2" onclick="S.f={};pinta()">limpar</button>':''}</section>`; }
function gavetaHtml(){ const base=doFunil(), at=ativosK(), v=vis().length;
  const grupos=['Ação','Perfil','Origem','Mercado'].map(g=>`<div class="gv-g"><h3>${g}</h3><div class="chips">${F.filter(x=>x[5]===g&&(S.fid==='vi'||!['quente','ta'].includes(x[0]))).map(([k,l,t,ic,fn])=>{ const n=base.filter(c=>passa(c,k)&&fn(c)).length, on=!!S.f[k];
    return `<button type="button" class="ch t-${t}${on?' on':''}${!n&&!on?' zero':''}" aria-pressed="${on}" onclick="filtro('${k}',1)">${ic?ic+' ':''}${esc(l)} <span class="q">(${n})</span></button>`; }).join('')}</div></div>`).join('');
  return `<h2>⚙ Filtros</h2>${grupos}
   <div class="gv-g"><h3>Filtros salvos</h3>${S.salvos.map((x,i)=>`<div class="gv-sv"><span>${esc(x.n)}</span><button type="button" class="mini" onclick="aplica(${i},1)" aria-label="Aplicar ${esc(x.n)}">▶</button><button type="button" class="mini" onclick="S.salvos.splice(${i},1);regav();pinta()" aria-label="Apagar ${esc(x.n)}">🗑</button></div>`).join('')||'<div style="color:var(--muted);font-size:13px">Nenhum ainda.</div>'}
    <div class="gv-salvar"><input id="sv-n" placeholder="${at.length?'Nome pro filtro atual (ex.: Quentes de Recife)':'Marque filtros acima pra salvar'}" ${at.length?'':'disabled'} aria-label="Nome do filtro salvo" onkeydown="if(event.key==='Enter')salva()"><button type="button" class="bt" ${at.length?'':'disabled'} onclick="salva()">💾 Salvar</button></div></div>
   <div class="gv-pe"><button type="button" class="bt" onclick="S.f={};regav();pinta()">Limpar</button><button type="button" class="bt p" onclick="fecha()">Ver ${v} card${v===1?'':'s'}</button></div>`; }
function gaveta(){ modal(gavetaHtml(),'gav'); }
function regav(){ const m=document.querySelector('.ov.gav .md'); if(m) m.innerHTML=gavetaHtml(); }
function aplica(i,daGaveta){ const x=S.salvos[i]; if(igual(x.f)) S.f={}; else S.f=Object.assign({},x.f); pinta(); if(daGaveta) regav(); }
function salva(){ const el=$('#sv-n'), n=(el&&el.value||'').trim(); if(!n){ toast('Dê um nome pro filtro'); if(el) el.focus(); return; } S.salvos.push({n,f:Object.assign({},S.f)}); regav(); pinta(); toast('Filtro “'+n+'” salvo · aparece no topo'); }
function desempenho(){ const l=doFunil().filter(c=>['rec','lead','parc'].includes(c.origem)), ord=cfg().map(e=>e.id), iOI=Math.max(0,ord.indexOf(S.fid==='vi'?'oi':'m_contato'));
  const linha=(m,t)=>{ const g=l.filter(c=>(c.mercado||null)===m), oi=g.filter(c=>ord.indexOf(c.etapa)>=iOI&&!E(c.etapa).enc).length, ap=g.filter(c=>['emitida','entrega','m_ativo'].includes(c.etapa)).length, p=(a,b)=>b?Math.round(100*a/b)+'%':'—';
    return `<tr><td>${t}</td><td class="n">${g.length}</td><td class="n">${p(oi,g.length)}</td><td class="n">${p(ap,g.length)}</td></tr>`; };
  return `<details class="des"><summary>📊 Ver desempenho por mercado</summary><div class="tw"><table><thead><tr><th>Mercado</th><th>Recs</th><th>% fizeram OI</th><th>% viraram apólice</th></tr></thead><tbody>${linha('X','Mercado X')}${linha('Y','Mercado Y')}${linha('Z','Mercado Z')}${linha(null,'Sem classificar ⚠')}</tbody></table></div></details>`; }

function cardHtml(c){ const e=E(c.etapa), sp=semProx(c); let st=''; for(let i=1;i<=5;i++) st+=`<span class="${i<=c.ance?'on':''}">★</span>`;
  const bds=[c.mercado?`<span class="bd t-${({X:'verde',Y:'amar',Z:'cinza'})[c.mercado]}">Mercado ${c.mercado}</span>`:'',c.origem==='lead'?'<span class="bd t-azul">Lead</span>':c.origem==='parc'?'<span class="bd t-lj">Parceiro</span>':c.origem==='cart'?'<span class="bd t-verde">Carteira</span>':'',c.delay?'<span class="bd t-verm">⏳ Delay</span>':'',alta(c)?'<span class="bd t-cinza">Alta renda</span>':''].join('');
  return `<article class="cd${sp?' semp':''}" draggable="true" data-id="${c.id}" onclick="toast('Abre a ficha em painel (Negócio · Pessoa · Histórico)')">
   <div class="cd-l1"><span class="alca" title="Arraste pra mover ou reordenar" aria-hidden="true">⠿</span><div class="cd-n"><span class="nm">${esc(c.nome)}</span><span class="i" title="Resumo rápido">ⓘ</span></div>${sp?'<span class="cd-av" title="Sem próximo passo">⚠ Sem próx. passo</span>':''}</div>
   ${S.fid==='vi'?`<div class="cd-st">${st}${c.ia?'<span class="ia" title="Estrelas pelo automático (IA/regras)">✨</span>':''}</div>`:''}
   <div class="cd-m">${c.produto?`<span><b>${esc(c.produto)}</b></span>`:''}<span>${esc(c.prof)}</span><span class="r"><span>${esc(c.cidade)}</span>${c.renda?`<span class="val">${brl(c.renda)}</span>`:''}</span>${c.prox?`<span>📅 ${c.prox.split('-').reverse().join('/')}</span>`:''}</div>
   ${bds?`<div class="cd-b">${bds}</div>`:''}
   <div class="cd-f" onclick="event.stopPropagation()"><span class="lb">Contato rápido</span>${c.prox?`<button type="button" title="Reunião feita" onclick="feito('${c.id}')">✓</button><button type="button" title="Delay (remarcou)" onclick="delay('${c.id}')">✕</button>`:''}<button type="button" title="Ligar" onclick="toast('Disca e pergunta como foi')">☏</button><button type="button" title="WhatsApp" onclick="toast('Abre o WhatsApp (nada é enviado sozinho)')">💬</button><button type="button" title="Mover de etapa" onclick="menuMover(event,'${c.id}')">⇄</button></div></article>`; }
function ordenar(l){ return l.slice().sort((a,b)=>S.ordem==='nome'?a.nome.localeCompare(b.nome):S.ordem==='prob'?E(b.etapa).p-E(a.etapa).p:S.ordem==='prox'?String(a.prox||'9').localeCompare(String(b.prox||'9')):(b.pos||0)-(a.pos||0)); }
function quadro(){ const v=vis(), p=colsDe(), cols=p.ordem.filter(id=>!p.ocultas.includes(id)); if(!cols.includes(S.tab[S.fid])) S.tab[S.fid]=cols[0];
  return `<section class="qd"><div class="qd-top"><label class="busca">🔎 <input id="q" type="search" placeholder="Buscar em qualquer coluna (nome, data, etapa, renda…)" value="${esc(S.q)}" oninput="busca(this.value)"></label><span class="res">${v.length} de ${doFunil().length} resultados</span></div>
   <div class="tabs">${cols.map(id=>`<button type="button" class="${S.tab[S.fid]===id?'on':''}" onclick="S.tab[S.fid]='${id}';pinta()">${E(id).ic} ${esc(E(id).l)} · ${v.filter(c=>c.etapa===id).length}</button>`).join('')}</div>
   <div class="board" id="board">${cols.map(id=>{ const e=E(id), l=ordenar(v.filter(c=>c.etapa===id)), sp=l.filter(semProx).length, pa=l.reduce((s,c)=>s+(c.renda?3000:0),0);
     return `<section class="col${e.enc?' enc':''}${S.tab[S.fid]===id?' vis':''}" data-col="${id}" aria-label="${esc(e.l)}">
       <div class="col-h"><span class="alca col-a" draggable="true" data-alca="${id}" title="Arraste pra mudar a ordem das colunas" aria-hidden="true">⠿</span><span class="ic" style="color:${CORES[e.cor]}">${e.ic}</span><b>${esc(e.l)}</b><span class="qt">${l.length}</span><button type="button" class="x" title="Organizar esta etapa" aria-label="Organizar ${esc(e.l)}" onclick="menuCol(event,'${id}')">⋯</button></div>
       <div class="col-s"><span>${e.enc?'encerramento':'prob. '+e.p+'%'}${sp?' · ⚠ '+sp:''}</span>${pa&&!e.enc?`<span class="pa">PA ${brl(pa)}</span>`:''}</div>
       <div class="cards" data-cards="${id}">${l.length?l.map(cardHtml).join(''):'<div class="vazio">Solte um card aqui</div>'}</div></section>`; }).join('')}
     <button type="button" class="nova-col" onclick="modalNova()">＋ Nova etapa</button></div></section>`; }
function pinta(){ const foco=document.activeElement&&document.activeElement.id; $('#app').innerHTML=topo()+filtros()+desempenho()+quadro(); if(foco==='q'){ const q=$('#q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); } liga(); }

/* arrastar: card (mover entre colunas e reordenar dentro) e coluna (pela alça do cabeçalho) */
function liga(){ const b=$('#board'); if(!b) return;
  b.querySelectorAll('.cd').forEach(cd=>{ cd.addEventListener('dragstart',e=>{ if(S.dragCol) return; S.drag=cd.dataset.id; cd.classList.add('arr'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',S.drag); });
    cd.addEventListener('dragend',()=>{ S.drag=null; cd.classList.remove('arr'); limpaMarca(); }); });
  b.querySelectorAll('[data-alca]').forEach(a=>{ a.addEventListener('dragstart',e=>{ e.stopPropagation(); S.dragCol=a.dataset.alca; a.closest('.col').classList.add('arr'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','col'); });
    a.addEventListener('dragend',()=>{ S.dragCol=null; pinta(); }); });
  b.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); if(S.dragCol){ col.classList.add('alvo'); return; } if(!S.drag) return; const box=col.querySelector('.cards'); limpaMarca(); const depois=[...box.querySelectorAll('.cd:not(.arr)')].find(x=>e.clientY<x.getBoundingClientRect().top+x.offsetHeight/2); const m=document.createElement('div'); m.className='drop-mark'; box.insertBefore(m,depois||null); });
    col.addEventListener('dragleave',e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('alvo'); });
    col.addEventListener('drop',e=>{ e.preventDefault(); col.classList.remove('alvo');
      if(S.dragCol){ const p=colsDe(), de=p.ordem.indexOf(S.dragCol), para=p.ordem.indexOf(col.dataset.col); if(de>=0&&para>=0&&de!==para){ p.ordem.splice(de,1); p.ordem.splice(para,0,S.dragCol); toast('Coluna '+E(S.dragCol).l+' mudou de lugar (só pra você)'); } S.dragCol=null; pinta(); return; }
      if(!S.drag) return; const c=S.cards.find(x=>x.id===S.drag), box=col.querySelector('.cards'), marca=box.querySelector('.drop-mark'), antes=marca&&marca.nextElementSibling&&marca.nextElementSibling.dataset.id;
      const dest=col.dataset.col, mudou=c.etapa!==dest; limpaMarca();
      if(E(dest).enc&&mudou){ S.drag=null; motivo(c,dest); return; }
      c.etapa=dest; const irm=ordenar(S.cards.filter(x=>x.funil===S.fid&&x.etapa===dest&&x!==c)); const i=antes?irm.findIndex(x=>x.id===antes):irm.length; irm.splice(i<0?irm.length:i,0,c); irm.forEach((x,k)=>x.pos=irm.length-k);
      S.ordem='rec'; S.drag=null; pinta(); toast(mudou?`${c.nome.split(' ')[0]} → ${E(dest).l} (registrado no histórico)`:`${c.nome.split(' ')[0]} mudou de posição na coluna`); }); }); }
function limpaMarca(){ document.querySelectorAll('.drop-mark').forEach(x=>x.remove()); }

/* ações */
function funil(f){ S.fid=f; S.f={}; pinta(); }
function filtro(k,daGaveta){ S.f[k]=!S.f[k]; pinta(); if(daGaveta) regav(); }
let qT; function busca(v){ S.q=v; clearTimeout(qT); qT=setTimeout(pinta,200); }
function esconder(id){ const p=colsDe(); if(p.ordem.length-p.ocultas.length<=1){ toast('Fica pelo menos uma coluna'); return; } p.ocultas.push(id); pinta(); toast(E(id).l+' escondida · volta em ▥ Colunas'); }
function feito(id){ const c=S.cards.find(x=>x.id===id); c.prox=null; c.nunca=false; pinta(); toast('✓ Reunião feita · agora diga o próximo passo'); }
function delay(id){ const c=S.cards.find(x=>x.id===id); c.delay=true; pinta(); toast('⏳ Delay marcado'); }
function motivo(c,dest){ modal(`<h2>Encerrar ${esc(c.nome.split(' ')[0])} em “${esc(E(dest).l)}”</h2><div class="fld"><label for="mot">Motivo</label><select id="mot"><option value="">— escolha —</option><option>Sem interesse</option><option>Sem renda / momento financeiro</option><option>Saúde (não passa na análise)</option><option>Já é cliente de outro LP</option></select></div><div class="acts"><button type="button" class="bt" onclick="fecha()">Cancelar</button><button type="button" class="bt p" onclick="if(!$('#mot').value){toast('Sem motivo não encerra');return;} encerra('${c.id}','${dest}')">Encerrar</button></div>`); }
function encerra(id,dest){ const c=S.cards.find(x=>x.id===id); c.etapa=dest; fecha(); pinta(); toast('Encerrado com motivo'); }

/* modal / menus */
function modal(h,cls){ fecha(); const o=document.createElement('div'); o.className='ov'+(cls?' '+cls:''); o.id='ov'; o.innerHTML=`<div class="md" role="dialog" aria-modal="true">${h}</div>`; o.addEventListener('click',e=>{ if(e.target===o) fecha(); }); document.body.appendChild(o); }
function fecha(){ const o=$('#ov'); if(o) o.remove(); }
function colsHtml(){ const p=colsDe();
  return `<h2>▥ Colunas (${p.ordem.length-p.ocultas.length}/${p.ordem.length})</h2><div style="font-size:12.5px;color:var(--muted)">Arraste ⠿ ou use ▲▼ pra mudar a ordem; desmarque pra esconder. Vale só pra você.</div>
   ${p.ordem.map((id,i)=>`<div class="crow" draggable="true" data-crow="${id}"><span class="alca" aria-hidden="true">⠿</span><label for="cv-${id}"><input type="checkbox" id="cv-${id}" ${p.ocultas.includes(id)?'':'checked'} onchange="vercol('${id}',this.checked)"> ${E(id).ic} ${esc(E(id).l)}${E(id).enc?' <span style="color:var(--muted);font-size:12px">· encerramento</span>':''}${E(id).nova?' <span class="bd t-roxo">nova</span>':''}</label><button type="button" class="mini" ${i?'':'disabled'} onclick="movcol(${i},-1)" aria-label="Subir">▲</button><button type="button" class="mini" ${i===p.ordem.length-1?'disabled':''} onclick="movcol(${i},1)" aria-label="Descer">▼</button></div>`).join('')}
   <div class="acts" style="justify-content:space-between"><button type="button" class="bt" onclick="modalNova()">＋ Nova etapa</button><button type="button" class="bt p" onclick="fecha();pinta()">Pronto</button></div>`; }
function modalCols(){ modal(colsHtml()); ligaCrow(); }
function ligaCrow(){ let de=null; document.querySelectorAll('[data-crow]').forEach(r=>{ r.addEventListener('dragstart',()=>{ de=r.dataset.crow; r.classList.add('arr'); }); r.addEventListener('dragend',()=>r.classList.remove('arr'));
  r.addEventListener('dragover',e=>e.preventDefault()); r.addEventListener('drop',e=>{ e.preventDefault(); const p=colsDe(), a=p.ordem.indexOf(de), b=p.ordem.indexOf(r.dataset.crow); if(a<0||b<0||a===b) return; p.ordem.splice(a,1); p.ordem.splice(b,0,de); $('.md').innerHTML=colsHtml(); ligaCrow(); pinta(); }); }); }
function vercol(id,on){ const p=colsDe(); if(on) p.ocultas=p.ocultas.filter(x=>x!==id); else if(p.ordem.length-p.ocultas.length>1) p.ocultas.push(id); $('.md').innerHTML=colsHtml(); ligaCrow(); pinta(); }
function movcol(i,d){ const p=colsDe(), j=i+d; [p.ordem[i],p.ordem[j]]=[p.ordem[j],p.ordem[i]]; $('.md').innerHTML=colsHtml(); ligaCrow(); pinta(); }
function modalNova(depois){ S.cor='azul'; S.depois=depois||null; modal(`<h2>＋ Nova etapa no funil ${esc(FUNIS[S.fid].nome)}</h2>
  <div class="fld"><label for="ne-n">Nome da etapa</label><input id="ne-n" placeholder="ex.: Aguardando exame médico" maxlength="40"></div>
  <div class="g2"><div class="fld"><label for="ne-d">Depois de qual etapa</label><select id="ne-d">${colsDe().ordem.filter(id=>!E(id).enc).map(id=>`<option value="${id}" ${S.depois===id?'selected':''}>${esc(E(id).l)}</option>`).join('')}</select></div><div class="fld"><label for="ne-p">Probabilidade de virar apólice (%)</label><input id="ne-p" type="number" inputmode="numeric" min="0" max="100" value="40"></div></div>
  <div class="fld"><label for="ne-t">Tipo</label><select id="ne-t"><option value="fluxo">Etapa do caminho (entra no PA)</option><option value="enc">Encerramento (pede motivo, sai do PA)</option></select></div>
  <div class="fld"><span style="font-size:12px;color:var(--muted);font-weight:600">Cor</span><div class="cores">${Object.entries(CORES).map(([k,v])=>`<button type="button" style="background:${v}" class="${k==='azul'?'on':''}" aria-label="${k}" onclick="S.cor='${k}';document.querySelectorAll('.cores button').forEach(b=>b.classList.toggle('on',b===this))"></button>`).join('')}</div></div>
  <div class="note">Direto daqui, sem ir em Configuração. Grava na mesma lista que o quadro, a Tabela, os KPIs e a ficha leem.</div>
  <div class="acts"><button type="button" class="bt" onclick="fecha()">Cancelar</button><button type="button" class="bt p" onclick="criaEtapa()">Criar etapa</button></div>`); setTimeout(()=>$('#ne-n').focus(),30); }
function criaEtapa(){ const n=$('#ne-n').value.trim(); if(!n){ toast('Dê um nome pra etapa'); $('#ne-n').focus(); return; }
  const id='x'+Date.now().toString(36), enc=$('#ne-t').value==='enc', e={id,l:n,ic:enc?'✖':'⭐',cor:S.cor,p:enc?0:Math.max(0,Math.min(100,+$('#ne-p').value||0)),enc,nova:true};
  const L=cfg(), i=L.findIndex(x=>x.id===$('#ne-d').value); L.splice(enc?L.length:i+1,0,e); const p=colsDe(); const j=p.ordem.indexOf($('#ne-d').value); p.ordem.splice(enc?p.ordem.length:j+1,0,id);
  fecha(); pinta(); toast('Etapa “'+n+'” criada'); }
let MENU=null; function fechaMenu(){ if(MENU){ MENU.remove(); MENU=null; } }
function menu(ev,h){ ev.stopPropagation(); fechaMenu(); const m=document.createElement('div'); m.className='menu'; m.innerHTML=h; document.body.appendChild(m); MENU=m; const r=ev.currentTarget.getBoundingClientRect(); let x=Math.min(r.left,innerWidth-m.offsetWidth-12), y=r.bottom+6; if(y+m.offsetHeight>innerHeight-10) y=Math.max(10,r.top-m.offsetHeight-6); m.style.left=Math.max(12,x)+'px'; m.style.top=y+'px'; }
function menuOrdem(ev){ menu(ev,`<div class="mh">Ordenar por</div>${[['rec','Mais recentes'],['prox','Próximo passo'],['prob','Prob. negócio'],['nome','Nome']].map(([k,t])=>`<button type="button" onclick="S.ordem='${k}';fechaMenu();pinta()">${S.ordem===k?'✓ ':'　'}${t}</button>`).join('')}`); }
function menuMais(ev){ menu(ev,`<div class="mh">Mais</div><button type="button" onclick="fechaMenu();toast('Vira tabela com as mesmas colunas e filtros')">☰ Ver como tabela</button><button type="button" onclick="fechaMenu();toast('Baixa a planilha (.csv)')">⤓ Exportar planilha</button>`); }
function menuCol(ev,id){ const p=colsDe(), i=p.ordem.indexOf(id), e=E(id);
  menu(ev,`<div class="mh">${esc(e.l)}</div><button type="button" onclick="fechaMenu();renomear('${id}')">✎ Renomear</button><button type="button" onclick="fechaMenu();corEtapa('${id}')">🎨 Cor e probabilidade</button>
   <button type="button" ${i?'':'disabled style="opacity:.5"'} onclick="fechaMenu();moveCol('${id}',-1)">← Mover pra esquerda</button><button type="button" ${i===p.ordem.length-1?'disabled style="opacity:.5"':''} onclick="fechaMenu();moveCol('${id}',1)">Mover pra direita →</button>
   <button type="button" onclick="fechaMenu();modalNova('${id}')">＋ Nova etapa depois desta</button><button type="button" onclick="fechaMenu();esconder('${id}')">🙈 Esconder (volta em Colunas)</button>`); }
function moveCol(id,d){ const p=colsDe(), i=p.ordem.indexOf(id), j=i+d; if(j<0||j>=p.ordem.length) return; [p.ordem[i],p.ordem[j]]=[p.ordem[j],p.ordem[i]]; pinta(); toast(E(id).l+' mudou de lugar'); }
function renomear(id){ const e=E(id); modal(`<h2>✎ Renomear etapa</h2><div class="fld"><label for="rn">Nome</label><input id="rn" value="${esc(e.l)}" maxlength="40" onkeydown="if(event.key==='Enter')okRen('${id}')"></div><div class="note">Muda o nome no quadro, na Tabela, nos KPIs e na ficha. Os cards ficam onde estão.</div><div class="acts"><button type="button" class="bt" onclick="fecha()">Cancelar</button><button type="button" class="bt p" onclick="okRen('${id}')">Salvar</button></div>`); setTimeout(()=>{ const r=$('#rn'); r.focus(); r.select(); },30); }
function okRen(id){ const v=$('#rn').value.trim(); if(!v){ toast('Nome vazio não vale'); return; } E(id).l=v; fecha(); pinta(); toast('Etapa renomeada'); }
function corEtapa(id){ const e=E(id); S.cor=e.cor; modal(`<h2>🎨 ${esc(e.l)}</h2><div class="fld"><span style="font-size:12px;color:var(--muted);font-weight:600">Cor</span><div class="cores">${Object.entries(CORES).map(([k,v])=>`<button type="button" style="background:${v}" class="${k===e.cor?'on':''}" aria-label="${k}" onclick="S.cor='${k}';document.querySelectorAll('.cores button').forEach(b=>b.classList.toggle('on',b===this))"></button>`).join('')}</div></div>${e.enc?'':`<div class="fld"><label for="cp">Probabilidade de virar apólice (%)</label><input id="cp" type="number" inputmode="numeric" min="0" max="100" value="${e.p}"></div>`}<div class="acts"><button type="button" class="bt" onclick="fecha()">Cancelar</button><button type="button" class="bt p" onclick="E('${id}').cor=S.cor;${e.enc?'':`E('${id}').p=Math.max(0,Math.min(100,+$('#cp').value||0));`}fecha();pinta();toast('Etapa atualizada')">Salvar</button></div>`); }
function menuMover(ev,id){ const c=S.cards.find(x=>x.id===id); menu(ev,`<div class="mh">Mover ${esc(c.nome.split(' ')[0])} para…</div>${cfg().map(e=>`<button type="button" ${e.id===c.etapa?'disabled style="opacity:.5"':''} onclick="fechaMenu();${e.enc?`motivo(S.cards.find(x=>x.id==='${id}'),'${e.id}')`:`S.cards.find(x=>x.id==='${id}').etapa='${e.id}';pinta();toast('Movido pra ${esc(e.l)}')`}">${e.ic} ${esc(e.l)}</button>`).join('')}`); }
document.addEventListener('click',e=>{ if(MENU&&!MENU.contains(e.target)) fechaMenu(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ fechaMenu(); fecha(); } });
pinta();
</script>
